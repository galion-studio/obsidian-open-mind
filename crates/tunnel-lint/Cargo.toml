[package]
name = "tunnel-lint"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only linter for a cloudflared ingress config.yml: flags routes to local ports where nothing listens."

[lib]
path = "src/lib.rs"

[[bin]]
name = "tunnel-lint"
path = "src/main.rs"

# No dependencies on purpose: the cloudflared ingress subset is parsed by hand
# and listeners are checked with std::net or read from captured `ss -ltn` text.
[dependencies]
