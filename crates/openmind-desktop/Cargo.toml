[package]
name = "openmind-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local control console for the Open Mind desktop: command field, stack view, file pick/read/upload, read-only health probes, and a 432 Hz seven-tone set. No model call. Loopback only."

[lib]
name = "openmind_desktop"
path = "src/lib.rs"

[[bin]]
name = "openmind-desktop"
path = "src/main.rs"

[dependencies]
galion-common = { path = "../galion-common" }

# Linux only. O_NOFOLLOW is not the same number on every architecture: x86
# uses 0x20000; on aarch64 and arm that bit is O_LARGEFILE and O_NOFOLLOW is
# 0x8000. Other targets do not link libc. `open_nofollow` in src/files.rs
# refuses a symlink from `symlink_metadata` and then opens the file.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
