#
# realtest: boots the WHOLE stack from release binaries on the runner
# (loopback ports 19500-19551, fixture configs, no secrets, no network
# beyond the toolchain and crates) and runs the galion-realtest scenarios.
# The live probe is NOT run here: it needs ssh to the VPS and stays manual.
name: realtest

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realtest-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TZ: Europe/Zagreb

jobs:
  box-stack:
    name: box stack scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
      - name: build the stack and run the scenarios (report also goes to the job summary)
        run: cargo xtask realtest --out target/realtest/ci
      - name: upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: realtest-box-stack
          path: |
            target/realtest/ci/junit.xml
            target/realtest/ci/report.md
            target/realtest/ci/fixture/logs/
          if-no-files-found: warn
