[workspace]
resolver = "2"
# crates/one-defence (read-only port of galion-light/one/defence.py) joins via this glob.
members = ["crates/*"]
# contrib/grokbot is a vendored, read-only material dump with its own package.
# It is not part of the OpenMind workspace.
exclude = ["contrib"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# serde_json `preserve_order` is pinned ON here, once, for the whole
# workspace (swarm/serde-order-pin, 2026-10-21). Cargo unifies features across
# the packages it builds, so a per-crate `features = ["preserve_order"]` made
# `cargo build -p X` (sorted keys) and `cargo build --workspace` (insertion
# order) produce different JSON for the same source. Member crates must use
# `serde_json = { workspace = true }` with no extra features; repo-check
# (`deps` check) enforces it. See docs/decisions/serde-order-pin.md.
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
toml = "0.8"

# Release profile:
# opt-level = "z" -> minimize binary size. The workspace crates are small I/O
# helpers and HTTP servers, not hot compute loops, and T3 targets < 2 MB per
# binary. Speed matters far less here than footprint, so "z" over "3".
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
