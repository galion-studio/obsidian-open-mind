# gaia-cortex drop-in (STAGED, wave-4 slot 387, NOT installed): keep the swarm's
# throwaway test units out of the Hermes boss handoff. Breakers, incidents,
# alerts and escalation records are unchanged; only the inbox file is skipped
# (escalation shows "handoff":"excluded" + the pattern; /stats handoffs_excluded).
# Needs a cortex build that carries swarm/cortex-handoff-exclude; an older
# binary ignores this env var (no effect, no failure). Do NOT put exclude_units
# into /etc/gaia-cortex/config.json for an older binary: its HermesConfig
# denies unknown fields and the service would refuse to start.
# Bad patterns (no 4-char literal prefix, or matching a production unit such as
# hermes-rs.service / galion-* / console*) make the cortex refuse to start.
# Install (owner, D-387-1): copy to /etc/systemd/system/gaia-cortex.service.d/;
#   systemd-analyze verify gaia-cortex.service; systemctl daemon-reload;
#   systemctl restart gaia-cortex; curl -s 127.0.0.1:8674/stats | jq .hermes_handoff.exclude_units
# Rollback: rm this file; systemctl daemon-reload; systemctl restart gaia-cortex.
[Service]
Environment="CORTEX_HERMES_EXCLUDE_UNITS=noloop*,sbxtest*,swarmtest-*"
