# DESK-ID: openmind.B31
# preset: build-tool
# schema: 1
# Data only. No program, no arguments, no interpreter, no unit, no install step.
# Network stays closed. Writes stay inside the caller-supplied workdir.
# The caller replaces every "{workdir}" and supplies the program.

workdir = "{workdir}"
env_allowlist = ["PATH", "LANG", "LC_ALL", "TZ", "TERM"]
env_set = [
  ["HOME", "{workdir}"],
  ["TMPDIR", "{workdir}"],
  ["CARGO_HOME", "{workdir}/.cargo"],
  ["CARGO_TARGET_DIR", "{workdir}/target"],
]
wall_timeout_secs = 600
cpu_secs = 300
mem_bytes = 1073741824 # 1 GiB, RLIMIT_AS
nofile = 1024
fsize_bytes = 536870912 # 512 MiB, RLIMIT_FSIZE
output_cap = 262144 # 256 KiB per stream
net = false
require_net_isolation = true
landlock = true
fs_read = [
  "/usr",
  "/bin",
  "/sbin",
  "/lib",
  "/lib64",
  "/etc",
  "/proc",
  "/dev/zero",
  "/dev/urandom",
  "/dev/random",
]
fs_write = []
namespaces = true
ro_root = true
hide_paths = ["/root", "/home", "/run/secrets", "/opt/galion"]
workdir_tmpfs_bytes = 536870912 # 512 MiB total work dir cap (private tmpfs, ENOSPC past it; memory, charged to the 1 GiB run cgroup)
workdir_tmpfs_inodes = 0 # 0 = bytes / 16 KiB, at least 1024
