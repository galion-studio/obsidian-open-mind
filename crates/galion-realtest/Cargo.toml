[package]
name = "galion-realtest"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-wide real-life test harness: boots the whole stack on spare ports, runs scenarios, writes JUnit + Markdown; plus a read-only live probe."

[lib]
path = "src/lib.rs"

[[bin]]
name = "galion-realtest"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }
zagreb-time = { path = "../zagreb-time" }
