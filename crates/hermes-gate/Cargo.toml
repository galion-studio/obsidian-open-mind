[package]
name = "hermes-gate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sandbox gate for Hermes work: a proposal (patch) is checked, applied and deployed live-style in a throwaway sandbox worktree, a signed pass record is written, and a live apply needs that record plus an owner approval signature. Prototype: never pushes, never touches a live path."

[[bin]]
name = "hermes-gate"
path = "src/bin/hermes-gate.rs"

[dependencies]
hermes-rs = { path = "../hermes-rs", default-features = false }
openmind-sandbox = { path = "../openmind-sandbox" }
serde_json = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
getrandom = "0.2"
