[planners]
structure = "one planner per sector, not per task"
sectors = ["gaia", "nerve", "cortex", "vps-ops", "integration-ci", "security", "docs-whitepaper"]
brief = "/workspace/swarm/plans/PLANNER-BRIEF.md"
outputs = "/workspace/swarm/plans/<sector>.md"
target_group_size = 50                 # owner target per task; planners also state the useful maximum
realistic_schedule_size = 16

[rules]
language = "Rust only; no Python"
licences = "MIT or permissive only, each borrowed piece documented with licence, source URL and purpose"
branches = "swarm/<slug> based on main; never push to main, never force-push, no PRs (owner merges)"
ports = "slot NN uses 19NN0-19NN9; real-harness 19500-19551"
vps = "read-only; working copy /opt/galion/openmind at 2f5a730 untouched; no deploys without owner approval"
timezone = "Europe/Zagreb with explicit offset"

[priority_rules]
