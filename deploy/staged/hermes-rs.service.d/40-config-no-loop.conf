# STAGED, NOT INSTALLED. Proposal for Slavik's approval (wave-4 slot 355,
# 2026-10-28 CET +01:00). Nothing on the VPS reads this file.
#
# hermes-gateway exits 2 only for config errors that a restart cannot fix
# (bad coding config, coding preflight refusal, bad offhost config, missing or
# short API key, session store open error). On 2026-10-27 19:45 CET such an
# error made systemd restart it 13 times in 46 s and the cortex open a
# circuit breaker. With this drop-in systemd stops after the first exit 2 and
# the unit stays "failed" with the reason in the journal. Bind errors exit 1
# and are still retried.
# Trade-off: a session store error (exit 2) that clears by itself is no
# longer retried. See docs/ops/hermes-rs-crashloop-r3.md (D-355-1).
#
# Install (only after approval):
#   install -m 0644 40-config-no-loop.conf /etc/systemd/system/hermes-rs.service.d/
#   systemctl daemon-reload   (no restart needed; applies to the next exit)
# Rollback: rm the file; systemctl daemon-reload

[Service]
RestartPreventExitStatus=2
