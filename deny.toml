#
# cargo-deny policy — slot 288 swarm/cargo-deny-gate (2026-10-27 CET +01:00).
# Follow-up to swarm/apache-allowlist-memo 56993b7a.
#
# POLICY
# - House licence for our crates: MIT (enforced).
# - Transitive allow-list = RULES.md "Open-source borrowing" MINUS plain
#   Apache-2.0 (that arm is owner-pending; see [licenses] exceptions and
#   docs/decisions/apache-2-allow-list.md AP-1..AP-6).
# - Dual MIT OR Apache-2.0 crates pass via the MIT arm (no exception needed).
# - Plain Apache-2.0-only crates must appear in the owner-pending exceptions
#   list below until Slavik picks option A/B/C in the apache-allowlist memo.
#
# Run (box):
#   export PATH=/workspace/swarm/tools/bin:$PATH
#   cargo deny --offline check licenses bans sources
#   cargo deny check advisories   # needs RustSec DB (network)
# Same file for edge/openmind-node:
#   cargo deny --manifest-path edge/openmind-node/Cargo.toml --config deny.toml check
#
# Anything else (GPL, LGPL, AGPL, MPL-only, SSPL, BUSL, non-commercial,
# missing licence) fails. An SPDX OR expression passes when any arm is allowed.

[graph]
all-features = true
# Every transitive dependency, for every target we ship or check.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-linux-android",
    "armv7-unknown-linux-gnueabihf",
    "x86_64-unknown-linux-gnu",
]

[licenses]
version = 2
allow = [
    "MIT",
    # OWNER-PENDING AP-4 / L7 (docs/security/tooling-licence-memo.md on
    # swarm/sec-tooling-licence-memo; also apache-2-allow-list.md AP-4).
    # Relaxation of Apache-2.0 for compiled-in runtime (libunwind / wasi).
    # Three crates already declare it as an OR choice and pass via MIT today:
    # wasi 0.11.1, wasip2 1.0.4, wit-bindgen 0.57.1.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
    "CC0-1.0",
    # Plain "Apache-2.0" is intentionally NOT in this list.
    # Owner-pending: see exceptions below + docs/decisions/apache-2-allow-list.md.
]
# Below this, cargo-deny refuses to guess a licence from a LICENSE file.
confidence-threshold = 0.93
# Allow-list entries with no current user (e.g. CC0-1.0) are fine.
unused-allowed-license = "allow"
# ---------------------------------------------------------------------------
# OWNER-PENDING Apache-2.0 list (exceptions).
# Each row is an Apache-2.0-only crate that would fail MIT-enforcing deny
# without this exception. Remove the row (and the crate) if Slavik picks
# option B; keep / promote plain Apache-2.0 into allow if option A.
# Reason notes live in docs/security/cargo-deny-gate-20261027.md (cargo-deny
# 0.20.2 exceptions accept only allow + crate/name keys).
# ---------------------------------------------------------------------------
exceptions = [
    # AP-1 (slot 295, swarm/safetensors-mit-alt): the Apache-2.0-only registry `safetensors`
    # 0.7.0 is replaced by the clean-room MIT vendor/safetensors-mit via [patch.crates-io],
    # so no exception is needed. If the owner rejects option C, drop the patch line in
    # Cargo.toml and restore: { allow = ["Apache-2.0"], crate = "safetensors" },
]

[licenses.private]
# Workspace crates are unpublished but declare MIT; keep checking them.
ignore = false

[bans]
multiple-versions = "warn"
# "warn", not "deny": 66/69 workspace crates still lack `publish = false`, so
# path deps look like public wildcards (slot 201 sec-deny-wildcards not on
# main-staging tip). Flip to "deny" once every crate sets publish = false.
# Offenders listed in docs/security/cargo-deny-gate-20261027.md.
wildcards = "warn"
allow-wildcard-paths = true
# Hard rule 1: no openssl / no Python bridge.
deny = [
    { crate = "openssl", reason = "RULES.md hard rule 1: no openssl" },
    { crate = "openssl-sys", reason = "RULES.md hard rule 1: no openssl" },
    { crate = "native-tls", reason = "pulls openssl on Linux" },
    { crate = "pyo3", reason = "RULES.md hard rule 1: Rust only, no Python" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
version = 2
yanked = "deny"
# No ignored advisories on this tip (paste/zip cleared on earlier branches;
# main-staging 98466ab is green — see gate doc).
ignore = []
