[workspace]
resolver = "2"
# crates/one-defence (read-only port of galion-light/one/defence.py) joins via this glob.
members = ["crates/*"]
# contrib/grokbot is a vendored, read-only material dump with its own package.
# It is not part of the OpenMind workspace.
exclude = ["contrib"]

[workspace.package]
edition = "2021"
# Minimum supported Rust = the pinned toolchain in rust-toolchain.toml (major.minor;
# 1.99.1 is the only compiler CI and the box test with). Bump together with
# rust-toolchain.toml and the workflow `toolchain:` inputs (docs/toolchain-pin.md).
rust-version = "1.99"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
toml = "0.8"

# Release profile:
# opt-level = "z" -> minimize binary size. The workspace crates are small I/O
# helpers and HTTP servers, not hot compute loops, and T3 targets < 2 MB per
# binary. Speed matters far less here than footprint, so "z" over "3".
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
