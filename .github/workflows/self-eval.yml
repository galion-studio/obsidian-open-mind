# SPDX-FileCopyrightText: 3000 Galion / galion-studio
#
# self-eval: the stack's own gate. Every job here must be green on `main`
# before the repository may be flipped to public (see docs/PUBLISHING.md).
# One workflow, merged from the package gate (fmt, clippy, test, gitleaks,
# license, no-Python, CJK, Zagreb timestamps) and ws/side's repo-check job.
# Read-only: no secrets, no publishing, no network beyond toolchain/crates
# and the checksum-verified gitleaks binary. Also callable from release.yml.
name: self-eval

on:
  push:
    branches: [ main ]
  # Unfiltered pull_request runs only for the default branch. Name main and
  # swarm/main-staging so a CI-fix PR into staging runs the same gate as PR #12.
  pull_request:
    branches: [ main, swarm/main-staging ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: self-eval-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TZ: Europe/Zagreb

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path edge/openmind-node/Cargo.toml --all -- --check

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - name: fetch musl graphs for the offline feature-pin cargo tree
        run: |
          # .cargo/config.toml sets curve25519_dalek_backend=serial, which
          # drops curve25519-dalek-derive on x86_64. cargo fetch honours that
          # cfg; cargo tree in release_feature_unify does not, so the offline
          # tree still asks for curve25519-dalek-derive. An empty RUSTFLAGS
          # replaces the config list and downloads that crate.
          RUSTFLAGS= cargo fetch --locked --target x86_64-unknown-linux-musl
          cargo fetch --locked --target aarch64-unknown-linux-musl
      - name: allow unprivileged user namespaces (hermes-tools sandbox)
        run: |
          set -eu
          # Ubuntu AppArmor lets unshare(CLONE_NEWUSER) succeed and then
          # refuses the uid_map write. hermes-tools sandboxed.rs needs the
          # map; openmind-sandbox will not run as the overflow uid.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns >/dev/null
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      - run: cargo test --workspace --locked

  # Cortex T5.3: replay every committed capture against its expected verdict
  # (crates/openmind-nerve/tests/replay-corpus/), fail on drift or on a
  # verdict that flaps over the capture plus 20 quiet hold cycles. The live
  # VPS captures stay on the box; CI replays the committed fixtures.
  replay-corpus:
    name: cortex replay corpus (drift + 20-cycle no-flap)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
      - run: cargo xtask replay-corpus

  omnode:
    name: omnode (edge/openmind-node, own workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --manifest-path edge/openmind-node/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path edge/openmind-node/Cargo.toml --locked

  # Universal-CPU gate (UNIVERSAL-CPU.md, UCPU-1): scripts/ucpu-gate.sh.
  # Tier 1: release build of EVERY binary (workspace + omnode) as static musl,
  # then the static check (no PT_INTERP / DT_NEEDED), the 2 MiB size budget
  # (no exceptions since slot 329; readelf, no file(1)) and the grep gate
  # (asm, arch intrinsics, CPU-specific codegen flags).
  # zig cc compiles the bundled SQLite C code for every target.
  ucpu-tier1:
    name: ucpu tier-1 build + static + size (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64-unknown-linux-musl, aarch64-unknown-linux-musl ]
    env:
      UCPU_TIER1: ${{ matrix.target }}
      UCPU_JOBS: 4
      UCPU_NICE: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy
      - name: install zig cc (pinned, checksum-verified)
        run: echo "ZIG=$(scripts/install-zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_ENV"
      - name: ucpu-gate grep build static size clippy
        run: scripts/ucpu-gate.sh grep build static size clippy

  # Tier 2: cargo check (all targets) for armv7 and aarch64-android. Android's
  # bundled SQLite compiles against zig's musl headers: check never links.
  # A real Android link needs the NDK (docs/ucpu.md).
  ucpu-tier2:
    name: ucpu tier-2 cargo check (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [ armv7-unknown-linux-musleabihf, aarch64-linux-android ]
    env:
      UCPU_TIER2: ${{ matrix.target }}
      UCPU_JOBS: 4
      UCPU_NICE: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: install zig cc (pinned, checksum-verified)
        run: echo "ZIG=$(scripts/install-zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_ENV"
      - run: scripts/ucpu-gate.sh check

  # Real run: aarch64 + armv7 static binaries of galion-one, tuner,
  # openmind-memory and hermes-gateway (--mock) under qemu-user, probed over
  # loopback HTTP. No network beyond the toolchain, no secrets, no spend.
  ucpu-qemu:
    name: ucpu real run under qemu-user (aarch64, armv7)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf
      - name: install qemu-user-static and zig cc
        run: |
          sudo apt-get update -q
          # The emulators the test invokes by name. Ubuntu 26.04 (resolute)
          # ships them as qemu-aarch64 and qemu-arm in qemu-user.
          # qemu-user-static is a virtual package there (no candidate) and a
          # real package on older images, where the names end in -static.
          sudo apt-get install -y -q qemu-user
          if apt-cache show qemu-user-static 2>/dev/null | grep -q '^Package: qemu-user-static$'; then
            sudo apt-get install -y -q qemu-user-static
          fi
          pick() {
            if command -v "$1" >/dev/null; then
              command -v "$1"
            elif command -v "$2" >/dev/null; then
              command -v "$2"
            else
              echo "missing $1 and $2" >&2
              exit 1
            fi
          }
          pick qemu-aarch64-static qemu-aarch64
          pick qemu-arm-static qemu-arm
          echo "ZIG=$(scripts/install-zig.sh "$RUNNER_TEMP/zig")" >> "$GITHUB_ENV"
      - run: cargo test -p galion-realtest --test real_sh_ucpu -- --nocapture
        env:
          GALION_REAL: "1"
          GALION_REAL_JOBS: "4"

  repo-check:
    name: repo-check self-eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: never
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - name: build repo-check (portable musl)
        run: cargo build --release --locked -p repo-check --target x86_64-unknown-linux-musl
      - name: self-eval
        run: |
          bin=target/x86_64-unknown-linux-musl/release/repo-check
          "$bin" --json --copyright "3000 Galion / galion-studio" > self-eval.json || true
          "$bin" --copyright "3000 Galion / galion-studio"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: self-eval
          path: self-eval.json
          retention-days: 14

  no-python:
    name: no Python (files or shebangs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fail on any *.py file or python shebang
        run: |
          set -eu
          bad=0
          if git ls-files '*.py' '*.pyc' '*.pyw' | grep -q .; then
            echo "::error::Python files are not allowed in this repository:"
            git ls-files '*.py' '*.pyc' '*.pyw'
            bad=1
          fi
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if head -n 1 -- "$f" | grep -aqE '^#!.*python'; then
              echo "::error file=$f::python shebang"
              bad=1
            fi
          done < <(git ls-files)
          [ "$bad" = 0 ] && echo "ok: no Python files, no python shebangs"
          exit "$bad"

  cjk-scan:
    name: no CJK characters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: scan tracked text for Han, Hiragana, Katakana, Hangul
        run: |
          set -eu
          if git ls-files -z | xargs -0 grep -InP \
            '[\x{2E80}-\x{2EFF}\x{3000}-\x{303F}\x{3040}-\x{30FF}\x{3400}-\x{4DBF}\x{4E00}-\x{9FFF}\x{AC00}-\x{D7AF}\x{F900}-\x{FAFF}]' ; then
            echo "::error::Stray CJK characters found. Remove them."
            exit 1
          fi
          echo "ok: no CJK characters"

  zagreb-timestamps:
    name: Zagreb timestamps (best effort, warning only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: warn on ISO timestamps ending in Z (UTC) in tracked text
        run: |
          set -u
          hits=$(git ls-files -z -- ':!*.lock' ':!.github/workflows/*' | xargs -0 grep -InE '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?(\.[0-9]+)?Z\b' || true)
          if [ -n "$hits" ]; then
            echo "$hits" | while IFS= read -r l; do echo "::warning::UTC-style timestamp (use Europe/Zagreb with offset): $l"; done
          else
            echo "ok: no Z-suffixed timestamps"
          fi

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks (checksum-verified binary)
        run: |
          set -eu
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tgz"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " $tgz\$" checksums.txt | sha256sum -c -
          tar xzf "$tgz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$tgz" checksums.txt gitleaks
      - name: scan full git history (values redacted in output)
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

  license:
    name: license check (MIT)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: LICENSE present and MIT; workspace declares MIT; crate copies identical
        run: |
          set -eu
          test -f LICENSE || { echo "::error::LICENSE missing"; exit 1; }
          head -n 1 LICENSE | grep -qx 'MIT License' || { echo "::error::LICENSE is not the MIT text"; exit 1; }
          grep -qx 'Copyright (c) 3000 Galion / galion-studio' LICENSE || { echo "::error::LICENSE copyright line changed"; exit 1; }
          grep -q 'Permission is hereby granted, free of charge' LICENSE || { echo "::error::MIT grant text missing"; exit 1; }
          grep -qE '^license *= *"MIT"' Cargo.toml || { echo "::error::Cargo.toml [workspace.package] license is not MIT"; exit 1; }
          for l in crates/*/LICENSE edge/*/LICENSE; do
            cmp -s LICENSE "$l" || { echo "::error file=$l::differs from root LICENSE"; exit 1; }
          done
          echo "ok: MIT"
