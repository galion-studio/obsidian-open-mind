# STAGED PROPOSAL ONLY. Drop-in for the existing console.service
# (/etc/systemd/system/console.service.d/upstream-8088.conf) so the current
# Node process stops owning 127.0.0.1:8080 and only serves the API behind
# galion-console-static on 127.0.0.1:8088. Same command as today, port moved.
# Phase 1 only: replace with a built API server (phase 2) or a Rust API port
# (phase 3) as described in docs/console-static.md. Needs Slavik's approval.
[Service]
ExecStart=
ExecStart=/opt/galion/tooling/node/bin/node scripts/with-app-env.mjs /opt/galion/console-ide/node_modules/vite/bin/vite.js dev --host 127.0.0.1 --port 8088 --strictPort
