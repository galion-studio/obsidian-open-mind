[package]
name = "galion-guardian"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Guardian daemon: probes on a beat, health/incident store, beat file, suggestions, activity and nerve lines. Records only; never kills, restarts or seals."

[features]
default = []
# guardian.db (health_checks/incidents) parity and the Hermes tool-loop warning
# reader. Pulls bundled SQLite (C), so it is off for cross targets.
sqlite = ["dep:rusqlite"]

[dependencies]
openmind-survival = { path = "../openmind-survival" }
zagreb-time = { path = "../zagreb-time" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"], optional = true }
