[package]
name = "openmind-memory"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
description = "API-compatible Rust replacement for the TencentDB tdai memory gateway (the endpoints Hermes uses): SQLite FTS5 BM25 recall, offline, std HTTP."

[[bin]]
name = "openmind-memory"
path = "src/main.rs"

[dependencies]
galion-common = { path = "../galion-common", version = "0.1.0" }
# bundled: SQLite (with FTS5) is compiled from the amalgamation; no system lib, no openssl.
rusqlite = { version = "0.32", default-features = false, features = ["bundled", "backup"] }
serde = { workspace = true }
serde_json = { workspace = true } # preserve_order: pinned in the root Cargo.toml
zagreb-time = { path = "../zagreb-time", version = "0.1.0" }
nerve-client = { path = "../nerve-client", version = "0.1.0" }
