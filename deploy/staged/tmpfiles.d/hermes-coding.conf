# STAGED, NOT INSTALLED. Proposal for Slavik's approval (wave-4 slot 397,
# 2026-10-28 CET +01:00). Nothing on the VPS reads this file.
#
# Why: the staged coding drop-in (deploy/staged/hermes-rs.service.d/
# coding-tools.conf) points hermes-rs at /srv/hermes-coding, but that folder
# does not exist on the VPS (slot 381, 2026-10-28 10:42 CET). With
# ProtectSystem=strict and ReadWritePaths=-/srv/hermes-coding a missing folder
# is silently skipped, so it stays read-only inside the unit and
# `hermes-gateway --check-config` exits 2 ("No such file or directory").
# This file makes systemd create the folders at boot (systemd-tmpfiles-setup,
# which every normal service is ordered after) and on demand, with the owner
# and mode the gateway expects. No ExecStartPre= and no unit change needed.
#
# Owner root:root because live hermes-rs runs as root (User= unset,
# DynamicUser=no; VPS read 2026-10-28 16:40 CET). Mode 0700 matches
# StateDirectoryMode=0700 / UMask=0077 and CodingConfig::prepare_dirs.
# Age "-" on every line: systemd-tmpfiles-clean never ages anything out.
# Only type "d" (create, fix mode/owner if it exists, never empty it):
# no D/R/r/x lines, so --remove and --clean leave the work alone.
# The worktree itself (/srv/hermes-coding/worktree) is NOT created here: it
# must be a real git clone (worktree_ok wants a .git directory), see the
# runbook step 1 in docs/ops/hermes-coding-dir-stage.md.
#
# Install (only after approval):
#   install -m 0644 hermes-coding.conf /etc/tmpfiles.d/hermes-coding.conf
#   systemd-tmpfiles --create /etc/tmpfiles.d/hermes-coding.conf
# Rollback: rm /etc/tmpfiles.d/hermes-coding.conf
#   (folders stay; remove them by hand only if the owner says so)

#Type Path                              Mode User Group Age
d     /srv/hermes-coding                0700 root root  -
d     /srv/hermes-coding/state          0700 root root  -
d     /srv/hermes-coding/state/stage    0700 root root  -
d     /srv/hermes-coding/state/tmp      0700 root root  -
d     /srv/hermes-coding/state/home     0700 root root  -
d     /srv/hermes-coding/state/cargo-home 0700 root root -
d     /srv/hermes-coding/state/target   0700 root root  -
