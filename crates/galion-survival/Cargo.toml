[package]
name = "galion-survival"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Refresh /opt/galion/galion-light/state/survival.json (host metrics + OpenRouter cash). Never prints a key. Replaces galion-light/scripts/survival.py."

[[bin]]
name = "galion-survival"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
zagreb-time = { path = "../zagreb-time" }
