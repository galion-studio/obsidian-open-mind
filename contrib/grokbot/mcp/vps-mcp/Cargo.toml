[package]
name = "vps-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
hex = "0.4.3"
humantime = "2.4.0"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
russh = { version = "0.65.0", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.53.3", features = ["full"] }
