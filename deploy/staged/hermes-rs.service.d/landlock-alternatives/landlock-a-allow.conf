# STAGED, NOT INSTALLED. One of THREE alternatives for owner decision D-320-1
# (slot 334, 2026-10-28 CET +01:00): what the coding tools do on a kernel
# without Landlock (the VPS: LXC on 6.8.12-43-pve, LSMs lockdown,capability,
# yama,apparmor). The choice is Slavik's; install AT MOST ONE of
#   landlock-a-allow.conf / landlock-b-refuse.conf / landlock-c-layered.conf
# and only together with coding-tools.conf. Evidence and trade-offs:
# docs/staged/coding-tools-landlock.md
#
# Option (a): start the coding tools without Landlock; isolation rests on the user/mount/pid/net namespaces, read-only root, hidden paths and the workdir tmpfs, but no run checks that those were actually enforced. Same effect as the legacy HERMES_RS_CODING_ALLOW_NO_LANDLOCK=1 that slots 176/185/320 tested.
