# 2026-10-21 18:14 +02:00 (Mate: nerve + cortex must never reach OpenRouter;
# Hermes on the VPS is the only research/LLM path).
# The nerve/cortex code (openmind-nerve aa77864) has no LLM client: it only GETs
# loopback /health and /metrics, and curls api.telegram.org only when
# NERVE_TELEGRAM_ENV is set (it is not). This drop-in:
#  - strips OPENROUTER_* / LLM key variable NAMES and NERVE_TELEGRAM_ENV from the env;
#  - asks systemd for loopback-only IP (IPAddressDeny/Allow). NOTE: this host is an
#    LXC container and the cgroup BPF IP filter is NOT enforced here (verified
#    2026-10-21 18:16 +02:00: a transient unit with the same lines still reached a
#    public host). It is kept as intent / for a non-LXC host; the real guard is the
#    code (no LLM path) + swarm/no-openrouter-nerve-cortex (egress guard, not deployed).
# Backup: /var/backups/galion-nerve.service-20261021-181414
# Rollback: rm this file; systemctl daemon-reload; systemctl restart galion-nerve
[Service]
IPAddressDeny=any
IPAddressAllow=localhost
UnsetEnvironment=OPENROUTER_API_KEY OPENROUTER_KEY_FILE OPENROUTER_BASE_URL OPENROUTER_MODEL OPENAI_API_KEY OPENAI_BASE_URL ANTHROPIC_API_KEY HERMES_API_KEY API_SERVER_KEY NERVE_TELEGRAM_ENV
