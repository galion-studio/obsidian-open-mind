# STAGED, NOT INSTALLED. Proposal for Slavik's approval (wave-4 slot 370,
# 2026-10-28 CET +01:00). Nothing on the VPS reads this file.
#
# Why: the live unit has Restart=on-failure, RestartSec=3 and systemd's
# default start limit (5 starts in 10 s). A start every 3 s never reaches
# 5 starts in 10 s, so the limit can NEVER trip: on 2026-10-27 19:45 CET
# hermes-rs restarted 13 times in 46 s until a human removed the drop-in.
# 40-config-no-loop.conf stops the loop for exit 2 (config errors); this
# drop-in bounds every other failure (exit 1 bind error, panic, OOM kill).
#
# Effect (measured on the VPS, systemd 255, see
# docs/real-tests/hermes-rs-noloop-dropin.md): restart delay grows 3 s ->
# 30 s over 4 steps; at most 5 starts in 120 s, then the unit stays
# "failed" (result start-limit-hit) and the journal says why. A short
# hiccup (port busy for a few seconds) still gets 4 retries over ~1 min.
#
# After a start-limit-hit, starting again needs a reset first:
#   systemctl reset-failed hermes-rs && systemctl start hermes-rs
# (the cortex R3 restart is refused with "start request repeated too
# quickly" until then, which is the point: no restart storm.)
#
# Install (only after approval; no restart needed, applies to the next failure):
#   install -m 0644 45-start-limit.conf /etc/systemd/system/hermes-rs.service.d/
#   systemctl daemon-reload
# Rollback: rm /etc/systemd/system/hermes-rs.service.d/45-start-limit.conf
#   && systemctl daemon-reload   (back to 5-in-10 s, i.e. no effective limit)

[Unit]
StartLimitIntervalSec=120
StartLimitBurst=5

[Service]
RestartSteps=4
RestartMaxDelaySec=30
