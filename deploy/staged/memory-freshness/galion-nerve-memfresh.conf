# STAGED, NOT INSTALLED (wave-4 slot 405, owner decision D-388-3 / D-405-1).
# Drop-in for galion-nerve.service that switches on the memory-freshness
# sensor. Target path when approved:
#   /etc/systemd/system/galion-nerve.service.d/memfresh.conf
# Needs BOTH (a) a nerve build that contains sensors/memory_freshness.rs
# (swarm/memory-freshness-sensor or a later nerve merge) and (b) an
# openmind-memory build with the `freshness` subcommand (1d7164b4 or later;
# the live openmind-memory-aa77864 has none -> the sensor would only report
# info `memory-freshness-unknown`, never alert). Install the memory binary
# side by side; do not replace the running openmind-memory service binary.
# Expect an immediate warn alert after install: the live store has been
# stale since 2026-10-19 14:57:55 +02:00 (slot 388) until D-388-1 lands.
[Service]
Environment=NERVE_MEMFRESH_BIN=/opt/galion/rust/bin/openmind-memory-freshness
Environment=NERVE_MEMFRESH_DATA_DIR=/var/lib/memory-tencentdb
Environment=NERVE_MEMFRESH_INSTANCE=galion
Environment=NERVE_MEMFRESH_MAX_AGE_H=24
Environment=NERVE_MEMFRESH_EVERY_S=900
Environment=NERVE_MEMFRESH_TIMEOUT_MS=10000
