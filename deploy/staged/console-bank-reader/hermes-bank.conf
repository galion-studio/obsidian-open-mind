# STAGED, NOT INSTALLED (wave 4 slot 351, 2026-10-28 CET +01:00). Owner decision D-336-2 / D-351-1 open.
# Drop-in for hermes-rs.service: /etc/systemd/system/hermes-rs.service.d/bank.conf
# The variables below are a DESIGN (docs/plans/console-bank-reader.md section 4); no hermes-rs build
# reads them yet. Second listener, loopback only, GET /api/v1/bank only, no API_SERVER_KEY needed
# (the main :8642 API keeps its key check). Keys come from the EnvironmentFile hermes-rs already
# loads (/opt/galion/hermes/.env); values are never logged, never returned.
[Service]
Environment=HERMES_RS_BANK_BIND=127.0.0.1:8649
# Background refresh; requests are served from the last snapshot (console-ui call budget is 4 s).
Environment=HERMES_RS_BANK_REFRESH_S=300
# Week spend: own ledger first, legacy Python DB (frozen since 2026-10-18) second.
Environment=HERMES_RS_BANK_SPEND_DBS=/var/lib/hermes-rs/rs-state.db:/opt/galion/hermes/state.db
# Runpod / OpenRouter fallback figures written by the survival probe (world-readable, no secrets).
Environment=HERMES_RS_BANK_SURVIVAL=/workspace/galion-light/state/survival.json
# Provider calls: OpenRouter GET /api/v1/key (+ /credits fallback), River GET /v1/models. Free,
# read-only endpoints; 0 = no provider calls (snapshot from local files only).
Environment=HERMES_RS_BANK_PROVIDERS=1
# Rollback: rm the drop-in, daemon-reload, restart hermes-rs (port 8649 closes; console shows 502 state).
