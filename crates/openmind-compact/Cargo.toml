[package]
name = "openmind-compact"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Model-free, deterministic context compaction for agent transcripts: SimHash dedup, anchors, BM25 + recency under a token budget."

[lib]
path = "src/lib.rs"

[[bin]]
name = "openmind-compact"
path = "src/bin/openmind-compact.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The CLI reads JSONL transcripts; the library itself has no dependencies.
cli = ["dep:serde_json"]

[dependencies]
serde_json = { workspace = true, optional = true }
