[package]
name = "galion-backup"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Periodic Galion backup (Rust port of galion-backup.sh: SQLite online snapshots, files tar, SHA256SUMS, 0600 tar.gz, rotation) plus the snapshot/verify/schema/migrate-baseline helpers."

[[bin]]
name = "galion-backup"
path = "src/main.rs"

[dependencies]
# Same pin/features as openmind-memory (already in Cargo.lock).
rusqlite = { version = "0.32", default-features = false, features = ["bundled", "backup"] }
# Pure-Rust deflate for the .tar.gz (no SIMD feature). gzip framing + CRC32 are ours.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
# umask, statvfs, getpwuid_r/getgrgid_r, signal, major/minor (already in Cargo.lock).
libc = "0.2"
zagreb-time = { path = "../zagreb-time" }
