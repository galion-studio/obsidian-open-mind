#
# STAGED, not installed. galion-guardian config for the VPS (B20 probe list as
# data). Every probe is read-only: loopback HTTP GET, systemctl is-active,
# df -P, /proc reads, file mtime. Nothing here restarts, kills or seals.
# Sources: guardian-tick.py PROBES, desk_heal.py PROBES, health-tick.py,
# keep.sh probe list, and the live listeners on 2026-10-18 (ss -ltn).

[guardian]
interval_s = 60
state_dir = "/opt/galion/galion-light/state/guardian"
# guardian.db parity (Galion One reads health_checks). Needs the sqlite build.
# The switch steps back the file up first; see docs/ws-survival.md.
store = "sqlite"
db = "/opt/galion/galion-light/guardian/guardian.db"
beat = "/opt/galion/hermes/last-guardian.ts"
keep_rows = 4000
hermes_state_db = "/opt/galion/hermes/state.db"
tool_warn_out = "/opt/galion/galion-light/state/eval/tool-warn.txt"
activity = "/opt/galion/hermes/activity.jsonl"
activity_every_s = 900
nerve = "/opt/galion/galion-light/state/guardian/nerve.jsonl"
digest_text = ""
warn_after = 2
restart_after = 4

[[probe]]
kind = "http"
name = "console"
port = 8080
path = "/api/v1/health"
ok_codes = [200, 401]

[[probe]]
kind = "http"
name = "hermes"
port = 8642
path = "/health"
ok_codes = [200]
loading_ok = true

[[probe]]
kind = "http"
name = "one"
port = 8091
path = "/health"
ok_codes = [200]
loading_ok = true

[[probe]]
kind = "http"
name = "whisper"
port = 8643
path = "/health"
ok_codes = [200]
loading_ok = true

[[probe]]
kind = "http"
name = "vision"
port = 8645
path = "/health"
ok_codes = [200]
loading_ok = true

[[probe]]
kind = "http"
name = "voice"
port = 8002
path = "/health"
ok_codes = [200]
loading_ok = true

[[probe]]
kind = "http"
name = "desk"
port = 8646
path = "/health"
ok_codes = [200]

[[probe]]
kind = "process"
name = "tunnel"
comm = "cloudflared"

[[probe]]
kind = "unit"
name = "unit:hermes"
unit = "hermes"

[[probe]]
kind = "unit"
name = "unit:cloudflared"
unit = "cloudflared"

[[probe]]
kind = "unit"
name = "unit:console"
unit = "console"

[[probe]]
kind = "unit"
name = "unit:memory-gateway"
unit = "memory-gateway"

[[probe]]
kind = "disk"
path = "/"
warn = 85.0
crit = 95.0

[[probe]]
kind = "mem"

[[probe]]
kind = "load"
