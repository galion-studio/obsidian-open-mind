# STAGED, NOT INSTALLED. D-SB4 (slot 318, swarm/sandbox-nonroot-stage, 2026-10-27 CET +01:00).
# Runs hermes-gateway as the dedicated non-root user hermes-rs instead of root.
# Written against the LIVE unit as-built on 2026-10-27 22:30 CET (hermes-rs.service + 50/60/70/90
# drop-ins, binary hermes-gateway-b7fbbc78). Reasoning, evidence, install and rollback:
# docs/staged/hermes-rs-nonroot.md. Nothing on the VPS reads this file.
#
# Why the two file hand-overs below are needed (VPS facts, 2026-10-27):
#   /opt/galion/hermes is drwx------ root:root, so a non-root gateway can neither read
#   config.yaml (it silently falls back to built-in defaults: Config::load skips a file it
#   cannot stat) nor open the legacy state.db (open_ro fails -> gateway exits 1 ->
#   Restart=on-failure crash loop). Both were reproduced on the VPS as uid 65534.
#   Host permissions stay as they are; systemd (root) hands the files over at start.
#
# Install (only after the owner's OK, as root on the VPS):
#   install -m 0644 deploy/staged/sysusers.d/hermes-rs.conf /etc/sysusers.d/hermes-rs.conf
#   systemd-sysusers /etc/sysusers.d/hermes-rs.conf
#   install -m 0644 80-nonroot.conf /etc/systemd/system/hermes-rs.service.d/80-nonroot.conf
#   systemctl daemon-reload && systemctl restart hermes-rs
#   (StateDirectory= re-owns /var/lib/hermes-rs to hermes-rs on that start.)
# Rollback: rm /etc/systemd/system/hermes-rs.service.d/80-nonroot.conf;
#   systemctl daemon-reload && systemctl restart hermes-rs
#   (root reads hermes-rs-owned state files fine; StateDirectory= re-owns them to root.)

[Service]
User=hermes-rs
Group=hermes-rs
# Static user (precedent: gaia-cortex, openmind-queue), not DynamicUser=: DynamicUser
# moves the state to /var/lib/private and makes the coding worktree uid unstable.

# config.yaml: systemd reads it as root and gives the service a private read-only copy
# under $CREDENTIALS_DIRECTORY (111389 B on 2026-10-27; systemd 255 caps credentials at
# 1 MiB per service, so the start fails if config.yaml ever grows past that).
# The gateway reads config.yaml once at start, so a start-time copy changes nothing.
LoadCredential=hermes-config.yaml:/opt/galion/hermes/config.yaml
Environment=HERMES_RS_CONFIG=%d/hermes-config.yaml

# Legacy Python state.db (40779776 B, frozen since 2026-10-18 22:12 CET; hermes.service
# is masked). Too big for a credential, so a privileged ("+") pre-start step copies it
# into the state dir, owned by hermes-rs, mode 0400. -C skips the copy when unchanged.
ExecStartPre=+/usr/bin/install -C -m 0400 -o hermes-rs -g hermes-rs /opt/galion/hermes/state.db /var/lib/hermes-rs/legacy-state.db
Environment=HERMES_RS_LEGACY_STATE_DB=/var/lib/hermes-rs/legacy-state.db

# Unchanged on purpose: EnvironmentFile=/opt/galion/hermes/.env is read by systemd as root,
# port 8642 is > 1024, ProtectSystem=strict / ProtectHome=read-only / NoNewPrivileges /
# UMask=0077 stay. Do NOT add RestrictNamespaces=, PrivateUsers= or ProtectControlGroups=
# (the hermes-tools sandbox needs unprivileged user/mount/pid/net namespaces).
