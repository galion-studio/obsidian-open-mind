#
# SAST: CodeQL for Rust (build-mode none) plus the GitHub Actions workflows.
# codeql-action is MIT. The CodeQL CLI and queries it downloads are under the
# GitHub CodeQL Terms: free for public open-source repositories; a private
# repository would need GitHub Advanced Security (paid). So, like
# scorecard.yml, the job runs only while the repository is public and is
# skipped (not red) while it is private. See docs/fuzzing.md.
# Actions are pinned by commit SHA.
name: codeql

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write   # upload SARIF to code scanning
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
