# STAGED ONLY (wave 4 slot 389, survival-refresh-writer). NOT installed.
# Drop-in for console-rust-primary.service (127.0.0.1:18080) so the console
# keeps /opt/galion/galion-light/state/survival.json fresh itself, without a
# systemd timer (F-371-1). Owner decision D-389-1 before install.
#
# Needs a console binary built from swarm/survival-refresh-writer (the live
# galion-console-serve-2d846fb8 rejects the --survival-* flags and would fail
# to start). The writer is the already-installed Rust galion-survival
# (sha256 8f1cb532..., S4.7); with default paths it reads the OpenRouter key
# from /opt/galion/hermes/.env itself; the console never reads the key, clears
# the writer env and discards its stdout.
#
# Install (owner only, after D-389-1):
#   install -m 0644 console-rust-primary-survival.conf \
#     /etc/systemd/system/console-rust-primary.service.d/60-survival.conf
#   systemctl daemon-reload && systemctl restart console-rust-primary.service
# Rollback: rm that file, daemon-reload, restart.
[Service]
ExecStart=
ExecStart=/opt/galion/rust/bin/galion-console-serve-SHA --bind 127.0.0.1:18080 --dist /opt/galion/console-dist --ui rust --local-api --pulse 127.0.0.1:8091 --desk 127.0.0.1:8646 --quiet --survival-file /opt/galion/galion-light/state/survival.json --survival-writer /opt/galion/rust/bin/galion-survival --survival-refresh-s 900 --survival-mode interval
# ProtectSystem=strict makes /opt read-only for the console and its child;
# the writer must replace state/survival.json (+ state/eval/survival.txt).
ReadWritePaths=-/opt/galion/galion-light/state
