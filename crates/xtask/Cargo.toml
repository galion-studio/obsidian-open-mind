[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "CI task runner (cargo xtask). std only (+ std-only galion-common); shells out to cargo, and for release-recipe to git, tar, rustc and the C compiler. Tasks: replay-corpus (cortex T5.3), release-recipe (slot 434); swarm/ci-workflow-rust 38a26cb has the full runner and takes this task as one more module."

[dependencies]
# std-only workspace crate (SHA-256, Europe/Zagreb time) for release-recipe; no third-party code.
galion-common = { path = "../galion-common" }
