<section class="ph-top" id="ph-top" aria-label="At a glance">
  <div class="ph-tile" id="ph-hermes">
    <p class="ph-k"><span class="hm-dot" id="ph-hermes-dot"></span>Hermes</p>
    <p class="ph-v" id="ph-hermes-v">checking</p>
    <p class="ph-s" id="ph-hermes-s"></p>
  </div>
  <div class="ph-tile" id="ph-wd">
    <p class="ph-k"><span class="hm-dot" id="ph-wd-dot"></span>Watchdog</p>
    <p class="ph-v" id="ph-wd-v">checking</p>
    <p class="ph-s" id="ph-wd-s"></p>
  </div>
  <div class="ph-tile ph-wide" id="ph-spend">
    <p class="ph-k"><span class="hm-dot" id="ph-spend-dot"></span>OpenRouter spend</p>
    <p class="ph-v" id="ph-spend-v">checking</p>
    <div class="ph-bar" id="ph-spend-bar" role="img" aria-label="Spend against the limit"><i id="ph-spend-fill"></i><b id="ph-spend-stop" title="stop line"></b></div>
    <p class="ph-s" id="ph-spend-s"></p>
  </div>
  <div class="ph-tile ph-wide" id="ph-alerts">
    <p class="ph-k">Waiting for a decision</p>
    <ul class="ph-list" id="ph-wd-list"><li class="ph-s">checking</li></ul>
  </div>
  <div class="ph-tile ph-wide" id="ph-health-t">
    <p class="ph-k">Health</p>
    <ul class="ph-health" id="ph-health"><li class="ph-s">checking</li></ul>
    <p class="ph-s" id="ph-backup"></p>
  </div>
  <p class="ph-upd" id="ph-upd" role="status"></p>
</section>
<h2 class="ph-h2">Approvals</h2>
