#
# Example OpenMind config. Every key is optional; omitted keys use the
# built-in defaults (loopback only). Env overrides: OPENMIND_<SECTION>_<KEY>.

[hosts]
ollama = "127.0.0.1"
hermes = "127.0.0.1"
# Optional remote probe host. Unset by default.
# remote_probe = "probe.example.invalid"

[ports]
ollama = 11434
hermes = 8642
whisper = 8643
docs = 8645
one = 8091
desk = 8646
console = 8080

[paths]
base = "/var/lib/openmind"

[limits]
max_body_bytes = 1048576
request_timeout_secs = 30
max_connections = 64
