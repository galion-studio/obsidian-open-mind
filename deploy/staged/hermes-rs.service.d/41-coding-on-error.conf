# STAGED, NOT INSTALLED. OPTION for owner decision D-355-2 (wave-4 slot 370,
# 2026-10-28 CET +01:00). Nothing on the VPS reads this file.
#
# With this drop-in a bad coding config or a coding preflight refusal no
# longer exits 2: the gateway logs the reason ("coding tools OFF, gateway
# continues") and keeps serving chat; the coding tools fail closed.
# Without it the default stays "exit" (exit 2; with 40-config-no-loop.conf
# the unit then stops once instead of looping).
#
# Needs a hermes-gateway built from swarm/hermes-rs-crashloop-r3 d76b70df or
# later. The live hermes-gateway-b7fbbc78 does not know the variable and
# ignores it (harmless, but it gives no protection there).
# coding-tools.conf sets the same line; this file is for a unit that gets its
# coding env from somewhere else (for example an operator test drop-in like
# the one on 2026-10-27 19:45 CET).
#
# Install (only after approval):
#   install -m 0644 41-coding-on-error.conf /etc/systemd/system/hermes-rs.service.d/
#   systemctl daemon-reload   (then restart at an approved time)
# Rollback: rm /etc/systemd/system/hermes-rs.service.d/41-coding-on-error.conf
#   && systemctl daemon-reload (then restart at an approved time)

[Service]
Environment=HERMES_RS_CODING_ON_ERROR=disable
