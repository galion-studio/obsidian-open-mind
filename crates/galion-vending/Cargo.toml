[package]
name = "galion-vending"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic long-horizon vending-machine business sim (benchmark B3): inventory truth, pricing, restock, cash drawer, theft/spoilage, durable log, score formula."

[[bin]]
name = "galion-vending"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
zagreb-time = { path = "../zagreb-time" }
galion-bench = { path = "../galion-bench" }
