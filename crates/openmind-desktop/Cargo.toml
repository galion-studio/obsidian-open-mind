[package]
name = "openmind-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local control console for the Open Mind desktop: command field, stack view, file pick/read/upload, read-only health probes, and a 432 Hz seven-tone set. No model call. Loopback only."

[lib]
name = "openmind_desktop"
path = "src/lib.rs"

[[bin]]
name = "openmind-desktop"
path = "src/main.rs"

[dependencies]
galion-common = { path = "../galion-common" }
# Linux and macOS take O_NOFOLLOW from libc. The value is not shared:
# Linux x86 is 0x20000; on Linux aarch64 and arm that bit is O_LARGEFILE
# and O_NOFOLLOW is 0x8000; macOS is 0x0100. Windows does not read this
# constant. open_nofollow passes FILE_FLAG_OPEN_REPARSE_POINT (0x00200000).
libc = "0.2"
