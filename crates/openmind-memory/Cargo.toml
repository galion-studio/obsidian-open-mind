[package]
name = "openmind-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "API-compatible Rust replacement for the TencentDB tdai memory gateway (the endpoints Hermes uses): SQLite FTS5 BM25 recall, offline, std HTTP."

[[bin]]
name = "openmind-memory"
path = "src/main.rs"

[dependencies]
# Release reproducibility (D-312-4): same dependency features alone and in the release set.
galion-feature-pin = { path = "../galion-feature-pin" }
galion-common = { path = "../galion-common" }
# bundled: SQLite (with FTS5) is compiled from the amalgamation; no system lib, no openssl.
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true } # preserve_order: pinned in the root Cargo.toml
zagreb-time = { path = "../zagreb-time" }
nerve-client = { path = "../nerve-client" }
