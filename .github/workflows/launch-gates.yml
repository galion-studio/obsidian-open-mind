#
# launch-gates: build the public-export tree (git archive + .gitattributes
# export-ignore) and run every gate over it: path policy, no binaries, no
# Python, built-in secret patterns, gitleaks, REUSE lint (comply), cargo deny
# (licences/bans/sources/advisories), CycloneDX SBOM. Read-only: it publishes
# nothing and never touches repository settings. The report and the SBOM are
# uploaded as a workflow artifact for review.
name: launch-gates

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-export:
    name: public export + gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
      - name: pinned scanners + cargo fetch + public export + gates
        run: cargo xtask launch-gates --out "$RUNNER_TEMP/public" --online
      - name: upload report and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launch-gates-report
          path: |
            ${{ runner.temp }}/public/REPORT.md
            ${{ runner.temp }}/public/MANIFEST.sha256
            ${{ runner.temp }}/public/logs/
            ${{ runner.temp }}/public/sbom/
          retention-days: 14
