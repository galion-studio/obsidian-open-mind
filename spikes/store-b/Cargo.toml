#
# Option (b) spike: redb for rows plus tantivy for BM25 full-text search,
# both pure Rust. Built standalone, not part of the workspace.
[package]
name = "store-b-spike"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]
redb = "2"
# tantivy's default features pull zstd-sys (C) through
# columnar-zstd-compression. lz4-compression uses lz4_flex (pure Rust).
tantivy = { version = "0.26", default-features = false, features = ["lz4-compression", "mmap"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
