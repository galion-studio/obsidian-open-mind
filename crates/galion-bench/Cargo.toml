[package]
name = "galion-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared benchmark harness: std-only mock HTTP server driven by JSONL fixtures, a std HTTP client, and 0-100 scorecards. Mock-only: never talks to a real bank or broker."

[lib]
path = "src/lib.rs"

[[bin]]
name = "galion-bench-mock"
path = "src/bin/galion-bench-mock.rs"

[dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }
zagreb-time = { path = "../zagreb-time" }
