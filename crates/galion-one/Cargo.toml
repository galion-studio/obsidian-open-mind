[package]
name = "galion-one"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Galion One: the operator's own ear, mind and mouth on one box."

[[bin]]
name = "galion-one"
path = "src/main.rs"

[dependencies]
galion-common = { path = "../galion-common" }

[dev-dependencies]
# Test-only cross-check of the dependency-free Zagreb clock (src/zagreb.rs)
# against the tz database. Not linked into the binary.
zagreb-time = { path = "../zagreb-time" }
