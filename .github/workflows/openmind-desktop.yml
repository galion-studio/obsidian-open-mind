#
# openmind-desktop gate. Linux builds, runs clippy and tests, then a local
# tarball. The aarch64 job cross-builds and runs those tests under qemu-user
# (same emulator split as the self-eval ucpu-qemu job). Windows
# (x86_64-pc-windows-msvc) and macOS (aarch64-apple-darwin) build, run
# clippy, and run the tests. They do not package a tarball.
# permissions stay contents: read. This file does not create a GitHub
# Release, upload an artifact, or publish a crate.
name: openmind-desktop

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openmind-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: build, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          components: clippy

      - name: build
        run: cargo build -p openmind-desktop --locked

      - name: clippy
        run: cargo clippy -p openmind-desktop --all-targets --locked -- -D warnings

      - name: test
        run: cargo test -p openmind-desktop --locked

      - name: local package (not uploaded)
        run: scripts/desktop/package-local.sh --out "$RUNNER_TEMP/openmind-desktop-dist"

      - name: verify local package
        run: scripts/desktop/verify-local.sh "$RUNNER_TEMP/openmind-desktop-dist"

      - name: publish flags are refused
        run: |
          set -eu
          expect_refuse() {
            set +e
            "$@"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              printf 'accepted a publish flag: %s\n' "$*" >&2
              exit 1
            fi
            if [ "$status" -ne 2 ]; then
              printf 'publish flag exited %s, want 2: %s\n' "$status" "$*" >&2
              exit 1
            fi
          }
          expect_refuse scripts/desktop/package-local.sh --publish
          expect_refuse scripts/desktop/package-local.sh --upload
          expect_refuse scripts/desktop/package-local.sh --gh-release
          expect_refuse scripts/desktop/verify-local.sh --cargo-publish
          expect_refuse env OPENMIND_DESKTOP_PUBLISH=1 scripts/desktop/package-local.sh --out "$RUNNER_TEMP/openmind-desktop-no-publish"
          if [ -e "$RUNNER_TEMP/openmind-desktop-no-publish" ]; then
            printf 'refused publish still created an output directory\n' >&2
            exit 1
          fi

  # Cross build of the same crate, then the test binary under qemu-user.
  # O_NOFOLLOW is libc::O_NOFOLLOW: 0x8000 on aarch64 and 0x20000 on x86, so
  # the host job cannot catch a hard-coded x86 flag. No C code, so no zig cc.
  # The linker is rust-lld from .cargo/config.toml. Nothing is uploaded.
  linux-aarch64:
    name: aarch64 build and test (qemu-user)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl
          components: clippy

      - name: install qemu-user
        run: |
          set -eu
          sudo apt-get update -q
          # The emulator the test invokes by name. Ubuntu 26.04 (resolute)
          # ships it as qemu-aarch64 in qemu-user. qemu-user-static is a
          # virtual package there (no candidate) and a real package on older
          # images, where the name ends in -static. Same split as the
          # self-eval ucpu-qemu job.
          sudo apt-get install -y -q qemu-user
          if apt-cache show qemu-user-static 2>/dev/null | grep -q '^Package: qemu-user-static$'; then
            sudo apt-get install -y -q qemu-user-static
          fi
          pick() {
            if command -v "$1" >/dev/null; then
              command -v "$1"
            elif command -v "$2" >/dev/null; then
              command -v "$2"
            else
              echo "missing $1 and $2" >&2
              exit 1
            fi
          }
          qemu=$(pick qemu-aarch64-static qemu-aarch64)
          echo "QEMU=$qemu" >> "$GITHUB_ENV"
          echo "qemu runner: $qemu"

      - name: build
        run: cargo build -p openmind-desktop --locked --target aarch64-unknown-linux-musl

      - name: clippy
        run: cargo clippy -p openmind-desktop --all-targets --locked --target aarch64-unknown-linux-musl -- -D warnings

      - name: test
        run: |
          set -eu
          test -n "$QEMU"
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUNNER="$QEMU"
          cargo test -p openmind-desktop --locked --target aarch64-unknown-linux-musl

  windows:
    name: build and test (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: build
        run: cargo build -p openmind-desktop --locked --target x86_64-pc-windows-msvc

      - name: clippy
        run: cargo clippy -p openmind-desktop --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings

      - name: test
        run: cargo test -p openmind-desktop --locked --target x86_64-pc-windows-msvc

  macos:
    name: build and test (aarch64-apple-darwin)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
          components: clippy

      - name: build
        run: cargo build -p openmind-desktop --locked --target aarch64-apple-darwin

      - name: clippy
        run: cargo clippy -p openmind-desktop --all-targets --locked --target aarch64-apple-darwin -- -D warnings

      - name: test
        run: cargo test -p openmind-desktop --locked --target aarch64-apple-darwin
