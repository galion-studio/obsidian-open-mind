[package]
name = "hermes-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "hermes-gateway: the Rust Hermes API server binary (shadow of hermes.service)."

[[bin]]
name = "hermes-gateway"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["hermes-rs/sqlite"]
# Sandboxed coding tools (fs_read, fs_write, git, cargo). Opt-in since slot 294
# (keeps the release binary under the 2 MiB budget): build with
# `--features coding`; even then OFF at run time unless
# HERMES_RS_CODING_WORKTREE is set.
coding = ["dep:hermes-tools"]

[dependencies]
hermes-rs = { path = "../hermes-rs", default-features = false }
hermes-tools = { path = "../hermes-tools", optional = true }
serde_json = { workspace = true }
