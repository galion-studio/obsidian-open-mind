# DRAFT — not pushed.
# DESK-ID: openmind.B44
# Cargo SBOM and license allowlist.
# workflow_dispatch only, so this file does nothing until it is
# intentionally pushed and someone starts it by hand.
# `cargo xtask sbom` (crates/xtask/src/sbom.rs) runs `cargo fetch --locked`
# (fills the cache, never rewrites Cargo.lock), then
# `cargo metadata --format-version 1 --offline`.
name: sbom (draft)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-sbom:
    name: cargo metadata SBOM and license allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable

      - name: cargo fetch --locked, write dist/sbom-cargo.json, check the allowlist
        run: cargo xtask sbom

      - name: upload sbom-cargo.json
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cargo
          path: dist/sbom-cargo.json
          retention-days: 14
