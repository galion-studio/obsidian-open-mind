[package]
name = "gaia"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gaia CLI: wires GAIA core to its nine subordinate functions; status, tick, the deterministic Faro-plague scenario (with --full-power), status --live (read-only) and heal-tick (approval-gated restart of box-local test services, nerve-recorded), JSON out."

[[bin]]
name = "gaia"
path = "src/main.rs"

# Throwaway loopback test service for `gaia heal-tick` (ports 19000-19999 only).
[[bin]]
name = "gaia-dummy"
path = "src/bin/gaia-dummy.rs"

[dependencies]
galion-common = { path = "../galion-common" }
gaia-core = { path = "../gaia-core" }
gaia-hades = { path = "../gaia-hades" }
gaia-minerva = { path = "../gaia-minerva" }
gaia-apollo = { path = "../gaia-apollo" }
gaia-hephaestus = { path = "../gaia-hephaestus" }
gaia-artemis = { path = "../gaia-artemis" }
gaia-poseidon = { path = "../gaia-poseidon" }
gaia-aether = { path = "../gaia-aether" }
gaia-demeter = { path = "../gaia-demeter" }
gaia-eleuthia = { path = "../gaia-eleuthia" }
gaia-live = { path = "../gaia-live" }
serde_json = { workspace = true }
zagreb-time = { path = "../zagreb-time" }
# Signed, expiring, single-use, scope-bound approvals for heal-tick
# (adapter::check_gaia + replay ledger). Pure Rust; see docs/third-party/gaia-hades-tokens.md.
hades-gate = { path = "../hades-gate" }
