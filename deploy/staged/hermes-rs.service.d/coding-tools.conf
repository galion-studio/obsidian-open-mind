# STAGED, NOT INSTALLED. Proposal for Slavik's approval (slot 17, 2026-10-20 +02:00).
# Drop-in for deploy/staged/hermes-rs.service that turns on the sandboxed coding
# tools (crates/hermes-tools). Reasoning, risks and rollback:
# docs/staged/hermes-tools-unit.md. Nothing on the VPS reads this file.
#
# Install (only after approval, and only after the base hermes-rs.service is approved):
#   install -d /etc/systemd/system/hermes-rs.service.d
#   install -m 0644 coding-tools.conf /etc/systemd/system/hermes-rs.service.d/
#   systemctl daemon-reload
# Rollback: rm /etc/systemd/system/hermes-rs.service.d/coding-tools.conf && systemctl daemon-reload
#
# Landlock (F-320-2, slot 334): this file does NOT choose what happens on a
# kernel without Landlock. Alone it means "refuse" (compiled default), so on
# the VPS today (no Landlock) hermes-gateway would exit 2 at start. Owner
# decision D-320-1: install exactly one of landlock-alternatives/landlock-{a,b,c}-*.conf
# next to it. See docs/staged/coding-tools-landlock.md.

[Service]
# --- coding tools: one worktree, one branch -------------------------------
# A dedicated clone, NOT /opt/galion/openmind (the gateway refuses that path anyway).
Environment=HERMES_RS_CODING_WORKTREE=/var/lib/hermes-rs/work/openmind
Environment=HERMES_RS_CODING_BRANCH=hermes/ticket
Environment=HERMES_RS_CODING_STATE=/var/lib/hermes-rs/coding
Environment=HERMES_RS_CODING_TOOLCHAIN=/opt/rust/toolchain
Environment=HERMES_RS_CODING_JOBS=2
# Pinned (slot 318, D-SB pack item 2): the workdir tmpfs cap per tool run. Same as the
# compiled default today, pinned so a later default change cannot move it silently.
Environment=HERMES_RS_CODING_WORKDIR_MB=512
Environment=HERMES_RS_CODING_NICE=19
Environment=HERMES_RS_CODING_CARGO_MEM_MB=2048
Environment=HERMES_RS_CODING_CARGO_CPU_PCT=100
# Per-run cgroups under this unit's own delegated cgroup; the gateway moves
# itself into <unit>/gateway with memory.max = 64M (today's budget).
Environment=HERMES_RS_CODING_CGROUP=delegate
Environment=HERMES_RS_CODING_GATEWAY_MEM_MB=64
# Caps stay exactly as in the base unit ($1.00 / $2.00 / 500 calls).

# --- resources: the unit total; the gateway itself stays at 64M -----------
Delegate=memory pids cpu
# 64M gateway + one 2G cargo run + headroom. Was 64M (too small for rustc).
MemoryMax=2304M
MemorySwapMax=0
# rustc + cargo -j 2 threads. Was 64.
TasksMax=512
# Never more than 2 cores for the whole unit, whatever runs inside.
CPUQuota=200%
Nice=10
IOSchedulingClass=idle

# --- filesystem: unchanged except the work tree lives in StateDirectory ---
# ProtectSystem=strict and ProtectHome=read-only stay. /var/lib/hermes-rs is
# already the only ReadWritePaths entry; work/ and coding/ live under it.
# The sandbox needs unprivileged user, mount, pid and net namespaces, so this
# unit must NOT set RestrictNamespaces=, PrivateUsers= or ProtectControlGroups=.
