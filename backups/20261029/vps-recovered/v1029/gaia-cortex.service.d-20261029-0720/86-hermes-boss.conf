# gaia-cortex drop-in: build c5cae88 (branch swarm/cortex-hermes-boss) + cortex -> Hermes boss handoff.
# Rollback: rm this file; systemctl daemon-reload; systemctl restart gaia-cortex (back to c7f56b8, no handoff).
[Service]
ExecStart=
ExecStart=/opt/galion/rust/bin/gaia-cortex-c5cae88 serve --config /etc/gaia-cortex/config.json
Environment=CORTEX_HERMES_HANDOFF=1
Environment=CORTEX_HERMES_PER_HOUR=6
