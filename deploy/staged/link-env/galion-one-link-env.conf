# STAGED ONLY (slot 356, D-318-2, 2026-10-28 CET). NOT INSTALLED. Owner decision.
# Optional alternative to play.sh sourcing link.env as shell: let systemd read
# the four GALION_* addresses as plain KEY=VALUE data (no shell evaluation).
#
# Install (owner, VPS window; needs a galion-one restart, so it is a live change):
#   install -m 600 -o root -g root /opt/galion/galion-light/publish/obsidian/link.env /etc/galion/link.env
#   install -D -m 644 galion-one-link-env.conf /etc/systemd/system/galion-one.service.d/10-link-env.conf
#   systemctl daemon-reload && systemctl restart galion-one
# Rollback:
#   rm /etc/systemd/system/galion-one.service.d/10-link-env.conf
#   systemctl daemon-reload && systemctl restart galion-one
#
# Why EnvironmentFile and not LoadCredential: galion-one reads GALION_EAR/
# MOUTH/MIND/EYE from its environment (crates/galion-one endpoint()), and the
# file (107 B, inferred) holds loopback addresses, not a credential.
# LoadCredential=link.env:/etc/galion/link.env would only expose the file under
# $CREDENTIALS_DIRECTORY and galion-one has no code that reads it. Use
# LoadCredential only if a real secret ever goes into this file, together with
# a galion-one change that reads it from $CREDENTIALS_DIRECTORY.
#
# systemd reads EnvironmentFile as root before dropping privileges, so the
# file can stay 600 root:root. The leading "-" keeps the unit starting if the
# file is missing (galion-one then uses its default ports).
[Service]
EnvironmentFile=-/etc/galion/link.env
