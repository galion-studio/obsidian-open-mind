[package]
name = "galion-desk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "galion-desk: the operator's desk endpoint. Reads the pod, never writes it."

[lib]
name = "galion_desk"
path = "src/lib.rs"

[[bin]]
name = "galion-desk"
path = "src/main.rs"

[dependencies]
galion-common = { path = "../galion-common" }
openmind-config = { path = "../openmind-config" }

[dev-dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }

# Own main (harness = false): the test binary doubles as the DESK_HERMES_BIN
# stub, so it can record exactly what galion-desk forks per /desk.
[[test]]
name = "real_mindpack_exec"
path = "tests/real_mindpack_exec.rs"
harness = false
