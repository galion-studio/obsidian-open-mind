# Install (only after approval):
#   install -m 0644 landlock-a-allow.conf /etc/systemd/system/hermes-rs.service.d/coding-tools-landlock.conf
#   systemctl daemon-reload   # takes effect at the next hermes-rs (re)start
# Rollback: rm /etc/systemd/system/hermes-rs.service.d/coding-tools-landlock.conf && systemctl daemon-reload

[Service]
Environment=HERMES_RS_CODING_NO_LANDLOCK=allow
