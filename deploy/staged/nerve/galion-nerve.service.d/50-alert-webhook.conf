#
# STAGED, NOT LIVE (slot 382 nerve-alerts-stage, 2026-10-28 +01:00).
# Optional loopback alert webhook for galion-nerve. Install only after the
# owner picks the target (D-382-1) AND a binary with the alert_sink module is
# deployed (the live nerve 9d1a4f3 ignores these variables).
#
# No secrets here, by design: the nerve only accepts http://<loopback>[:port]/path
# with no userinfo/query/fragment. Any upstream token (ntfy auth, Telegram bot
# token, Hermes key) lives in the relay that listens on that loopback port.
#
# Target below = option A (self-hosted ntfy on 127.0.0.1:2586, topic
# galion-nerve; port free on the VPS 2026-10-28 10:43 +01:00, no ntfy installed).
# Sizing from the live journal (24 h to 10:43 +01:00): 249 warn+crit alerts,
# 35 crit, max 6 crit in any hour -> min=crit at 6/h drops nothing crit;
# min=warn at 6/h would have dropped 109 in 22 of 24 hours.
[Service]
Environment=NERVE_ALERT_WEBHOOK=http://127.0.0.1:2586/galion-nerve
Environment=NERVE_ALERT_WEBHOOK_FORMAT=ntfy
Environment=NERVE_ALERT_WEBHOOK_MIN=crit
Environment=NERVE_ALERT_WEBHOOK_PER_HOUR=6
