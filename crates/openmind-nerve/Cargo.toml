[package]
name = "openmind-nerve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NERVE + CORTEX: the Galion signals hub. Pull probes (health endpoints, systemd, journald, access logs) and POST /signal ingest, incident correlation, cortex view (vulnerabilities, bleeding, DDoS rate anomalies), self-eval scoring, one loopback JSON API and a dashboard. Also the append-only JSONL nerve writer. std + serde + serde_json + zagreb-time."

[lib]
path = "src/lib.rs"

[[bin]]
name = "openmind-nerve"
path = "src/main.rs"

# Optional sensor pulls (slot 385, F-376-1, 2026-10-28 CET +01:00). Each of these
# S2 sensors is already off at run time unless its NERVE_* env is set; the
# feature lets a lean build drop its code and its dependency too. All on by
# default, so the default build keeps every sensor (same size and strings; not
# bit-identical: the feature set is part of the crate hash). A build without a
# feature warns on stderr when the matching env is set (the sensor is not
# silently lost). Sizes: docs/real-tests/nerve-dep-growth.md.
[features]
default = ["sensor-rustsec", "rustsec-snapshot", "sensor-drift", "sensor-ingress-lint"]
# T2.4 rustsec sensor (pulls semver).
sensor-rustsec = ["dep:semver"]
# The embedded 97 KB RustSec advisory snapshot (data/rustsec/advisories.tsv).
# Without it the rustsec sensor needs NERVE_RUSTSEC_DB (else it reports
# `rustsec-unreadable`).
rustsec-snapshot = ["sensor-rustsec"]
# T2.5 drift sensor (pulls galion-common for SHA-256).
sensor-drift = ["dep:galion-common"]
# T2.6 ingress-lint sensor (pulls tunnel-lint).
sensor-ingress-lint = ["dep:tunnel-lint"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
semver = { version = "1", optional = true }
zagreb-time = { path = "../zagreb-time" }
galion-common = { path = "../galion-common", optional = true }
tunnel-lint = { path = "../tunnel-lint", optional = true }

[dev-dependencies]
zagreb-time = { path = "../zagreb-time" }
openmind-schema = { path = "../openmind-schema" }
# T3.6 consumer compatibility (tests/consumer_compat.rs): the real consumer crates,
# so their own HTTP clients and contract tables are what is checked. All path
# crates of this workspace; none depends on openmind-nerve (no cycle).
nerve-client = { path = "../nerve-client" }
gaia-live = { path = "../gaia-live" }
galion-realtest = { path = "../galion-realtest" }
galion-deploy = { path = "../galion-deploy" }
toml = { workspace = true }
# Fuzz/property targets (T5.2) also drive the ingress YAML parser; path crate, no deps.
tunnel-lint = { path = "../tunnel-lint" }

# Tests that need an optional sensor (slot 385): skipped, not failed, in a
# lean build (`--no-default-features`). Every other test file is auto-found.
[[test]]
name = "cortex_s2a_replay"
required-features = ["rustsec-snapshot"]

[[test]]
name = "real_cortex_s2a"
required-features = ["rustsec-snapshot"]

[[test]]
name = "real_cortex_s2b"
required-features = ["sensor-drift"]

[[test]]
name = "real_cortex_t20"
required-features = ["rustsec-snapshot", "sensor-drift"]

[[test]]
name = "cortex_ingress_lint"
required-features = ["sensor-ingress-lint"]

[[test]]
name = "real_cortex_ingress_lint"
required-features = ["sensor-ingress-lint"]
