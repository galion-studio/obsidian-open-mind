[workspace]
resolver = "2"
# crates/one-defence (read-only port of galion-light/one/defence.py) joins via this glob.
members = ["crates/*"]
# contrib/grokbot is a vendored, read-only material dump with its own package.
# It is not part of the OpenMind workspace.
exclude = ["contrib", "vendor"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "alloc"] }
# serde_json `preserve_order` is pinned ON here, once, for the whole
# workspace (swarm/serde-order-pin, 2026-10-21). Cargo unifies features across
# the packages it builds, so a per-crate `features = ["preserve_order"]` made
# `cargo build -p X` (sorted keys) and `cargo build --workspace` (insertion
# order) produce different JSON for the same source. Member crates must use
# `serde_json = { workspace = true }` with no extra features; repo-check
# (`deps` check) enforces it. See docs/decisions/serde-order-pin.md.
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
toml = "0.8"
# Release reproducibility (slot 325, D-312-4, 2026-10-27): Cargo unifies features only over
# the packages selected for one build, so `cargo build -p X` and the 12-binary release set
# compiled shared crates with different features and gave different bytes. The features of
# every dependency shared by release binaries are therefore decided here, once:
# - serde: `alloc` on, so serde_core is always alloc+result+std (serde_json alone turns on
#   alloc, serde alone turns on result);
# - rusqlite: `backup` on for every user (galion-backup and openmind-memory need it; LTO drops
#   it from the others);
# - indexmap: default (`std`), the set toml_edit turns on; crates that reach it only through
#   serde_json `preserve_order` (no std) depend on crates/galion-feature-pin.
# Members use `{ workspace = true }`. Guard: crates/galion-feature-pin/tests/release_feature_unify.rs
# (cargo tree: every release binary alone == inside the full release set, x86_64 + aarch64 musl).
rusqlite = { version = "0.32", default-features = false, features = ["bundled", "backup"] }
indexmap = "2"

# Release profile:
# opt-level = "z" -> minimize binary size. The workspace crates are small I/O
# helpers and HTTP servers, not hot compute loops, and T3 targets < 2 MB per
# binary. Speed matters far less here than footprint, so "z" over "3".
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Exception to opt-level "z" for the on-device voice models only (voice-rust):
# Chatterbox and Whisper run billions of multiply-adds per request in candle
# and gemm, and "z" makes those loops several times slower. Size of every other
# binary is unchanged (per-package overrides apply only where these crates are
# linked, i.e. the voice service).
[profile.release.package.candle-core]
opt-level = 3
[profile.release.package.candle-nn]
opt-level = 3
[profile.release.package.gemm]
opt-level = 3
[profile.release.package.gemm-common]
opt-level = 3
[profile.release.package.gemm-f32]
opt-level = 3
[profile.release.package.gemm-f16]
opt-level = 3
[profile.release.package.gemm-f64]
opt-level = 3
[profile.release.package.gemm-c32]
opt-level = 3
[profile.release.package.gemm-c64]
opt-level = 3
[profile.release.package.pulp]
opt-level = 3
[profile.release.package.half]
opt-level = 3
[profile.release.package.rayon-core]
opt-level = 3
[profile.release.package.galion-chatterbox]
opt-level = 3
# galion-voice-cpu owns the galion-voice-serve binary. Cargo links a crate's binaries with its package
# override, and an override without `strip` falls back to cargo's default "debuginfo" (binary kept
# .symtab, size-budget FAIL). So repeat `strip = true` here; guard: crates/galion-voice-cpu/tests/release_strip.rs.
[profile.release.package.galion-voice-cpu]
opt-level = 3
strip = true

# RUSTSEC-2026-0367/0368/0369: no candle release (0.9.2..0.11.0, nor upstream main) allows zip >= 9.
# vendor/candle-core is candle-core 0.9.2 with its zip requirement 7.2 -> 9.0.5 and its AVX2/NEON/simd128
# kernels removed (no-SIMD rule; vendor/candle-core/GALION-PATCH.md item 6).
# See docs/security/candle-zip-fix.md. Drop this patch once upstream candle requires zip >= 9.
# RUSTSEC-2024-0436: `paste` (via gemm/pulp under candle-core) is unmaintained. vendor/paste-pastey is a
# 20-line shim named `paste` that re-exports the maintained drop-in fork `pastey` 0.2.3 (MIT OR Apache-2.0).
# See docs/security/deny-paste-replace.md. Drop it once gemm/pulp move off `paste` themselves.
[patch.crates-io]
candle-core = { path = "vendor/candle-core" }
paste = { path = "vendor/paste-pastey" }
