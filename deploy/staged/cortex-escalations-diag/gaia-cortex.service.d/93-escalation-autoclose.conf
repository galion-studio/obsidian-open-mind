# gaia-cortex drop-in (STAGED, wave-4 slot 417, NOT installed): close open
# escalations (GET /escalations, /health escalations_open) when their cortex
# incident resolves, and any still open after 6 h. Before this nothing in the
# stack ever acked one (0 ack lines in 7 days of escalations.jsonl), so the
# open count only grew until the next restart silently emptied it.
# Every close is one {"close":id,"why":...} line in escalations.jsonl; closed
# items stay visible in /escalations closed_recent + closed_total and in
# /stats escalations_closed_incident / escalations_closed_expired.
# Needs a cortex build that carries swarm/cortex-escalations-diag; an older
# binary ignores these env vars (no effect, no failure). Do NOT put the keys
# into /etc/gaia-cortex/config.json for an older binary: Config denies
# unknown fields and the service would refuse to start.
# Install (owner, D-417-1): copy to /etc/systemd/system/gaia-cortex.service.d/;
#   systemd-analyze verify gaia-cortex.service; systemctl daemon-reload;
#   systemctl restart gaia-cortex; curl -s 127.0.0.1:8674/stats | jq '{escalations_closed_incident,escalations_closed_expired}'
# Rollback: rm this file; systemctl daemon-reload; systemctl restart gaia-cortex.
# 6 h (D-417-2 option A): at the live 15:37 reading it leaves 0 of 11 open;
# 24 h (option B) would have left all 11 (oldest 19 h 51 min).
[Service]
Environment=CORTEX_ESCALATION_AUTOCLOSE=1
Environment=CORTEX_ESCALATION_MAX_AGE_S=21600
