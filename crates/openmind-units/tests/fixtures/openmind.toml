#
# Fixture openmind.toml for the unit renderer.
# Reading this file does not install a unit.

[hosts]
ollama = "127.0.0.1"
hermes = "127.0.0.1"

[ports]
ollama = 11434
hermes = 8642
whisper = 8643
docs = 8645
one = 8091
desk = 8646
console = 8080
tuner = 8650

[paths]
base = "/var/lib/openmind"
bin = "/opt/galion/openmind/dist/bin"

[limits]
max_body_bytes = 1048576
request_timeout_secs = 30
max_connections = 64

[[unit]]
name = "galion-one"
description = "Galion One (rendered from openmind.toml, staged, not installed)"
exec_start = "{paths.bin}/galion-one"
after = "network-online.target"
wants = "network-online.target"
environment = [
  "ONE_BIND={hosts.ollama}:{ports.one}",
  "ONE_MOUTH_BIND={hosts.ollama}:8002",
]
restart = "always"
restart_sec = 3

[[unit]]
name = "galion-desk"
description = "Galion desk (rendered from openmind.toml, staged, not installed)"
exec_start = "{paths.bin}/galion-desk"
after = "network.target"
environment = [
  "DESK_BIND={hosts.ollama}:{ports.desk}",
  "DESK_HERMES_BIN={paths.bin}/desk-hermes",
]
restart = "always"
restart_sec = 5

[[unit]]
name = "link-watch"
description = "Laptop link watch (rendered from openmind.toml, staged, not installed)"
exec_start = "{paths.bin}/link-watch"
after = "network-online.target"
restart = "always"
restart_sec = 5

[[unit]]
name = "tuner"
description = "Ukulele tuner (rendered from openmind.toml, staged, not installed)"
exec_start = "{paths.bin}/tuner"
after = "network-online.target"
environment = [
  "TUNER_ADDR={hosts.ollama}:{ports.tuner}",
]
restart = "always"
restart_sec = 5
