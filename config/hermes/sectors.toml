# Hermes sector registry (crates/hermes-core). Written 2026-10-20 21:30 CEST (+02:00).
# Seeded from the seven sector plans in /workspace/swarm/plans/*.md (planners
# finished 2026-10-20 20:44-20:46 CEST). `planner_*` numbers are what each
# planner reported (CALL-RECORD.md 20:44-20:46); `hermes readiness` checks
# that the plan loader reproduces them from the plan files.
#
# Gaia mapping: every name in `gaia_systems` must be one of the 52 systems of
# gaia_core::System (swarm/gaia-land 9d3ec18) and its owning function must be
# listed in `gaia_functions`. The registry refuses to load otherwise.

[hermes]
# The boss. One session, always counted against the cap.
boss_agent = "hermes"
# Planned models (OpenRouter). Latest names as recorded in the repo
# (hermes-rs Config::defaults, TEACHER/BOSS.md). OpenRouter answers 402
# (credit) today, so only the offline mock provider is wired. Slavik decides.
boss_model = "anthropic/claude-opus-5.5"
boss_reasoning = "high"
sub_model = "anthropic/claude-sonnet-5.5"
provider = "mock"
# Concurrency governor. Measured request limit on 2026-10-20: about 18-20
# concurrent agents (11 of 15 lost at ~20:14; 16 survived from 20:34; stops at
# 20 and 22 at 20:38). Default cap 16 leaves a margin of 2 under the floor.
concurrency_cap = 16
measured_limit_low = 18
measured_limit_high = 20
# Slots held back for always-on sessions (the boss).
reserved_slots = 1
plans_dir = "/workspace/swarm/plans"

[retry]
# Request-limit stops and stalls are retried until done (Slavik, Q13 20:41).
max_attempts = 8
backoff_base_secs = 30
backoff_factor = 2
backoff_max_secs = 600
# Plain errors (not limit, not stall) get fewer tries before Failed.
max_error_attempts = 2

[hades]
# hades-gate config (flat TOML: admin_pubkey, ledger, disable_file). Empty
# means no HADES: every merge, deploy or destructive task is refused.
config = ""

