[package]
name = "openmind-mcp-stack"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stdio MCP server: OpenMind memory tools over the loopback openmind-memory API plus read-only Obsidian vault tools."

[[bin]]
name = "openmind-mcp-stack"
path = "src/main.rs"

[dependencies]
galion-common = { path = "../galion-common" }
serde_json = { workspace = true }
zagreb-time = { path = "../zagreb-time" }

[dev-dependencies]
openmind-memory = { path = "../openmind-memory" }
