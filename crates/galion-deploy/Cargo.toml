[package]
name = "galion-deploy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Backup -> atomic install -> restart -> health check -> automatic rollback, for one systemd (or simsup) unit. Rust replacement for deploy/foundation/galion-deploy."
publish = false

# std only: no dependencies, not even libc (the four libc calls are declared in src/sys.rs).
[dependencies]

[[bin]]
name = "galion-deploy"
path = "src/main.rs"
