# SPDX-FileCopyrightText: 3000 Galion / galion-studio
#
# self-eval: the stack's own gate. Every job here must be green on `main`
# before the repository may be flipped to public (see docs/PUBLISHING.md).
# One workflow, merged from the package gate (fmt, clippy, test, gitleaks,
# license, no-Python, CJK, Zagreb timestamps) and ws/side's repo-check job.
# Read-only: no secrets, no publishing, no network beyond toolchain/crates
# and the checksum-verified gitleaks binary. Also callable from release.yml.
# Every step is `cargo xtask <task>` (crates/xtask, docs/ci.md): the same
# command runs locally, and the YAML only lists checkout, toolchain, task.
name: self-eval

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: self-eval-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TZ: Europe/Zagreb

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo xtask fmt

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          components: clippy
      - run: cargo xtask clippy

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
      - run: cargo xtask test

  omnode:
    name: omnode (edge/openmind-node, own workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          components: clippy
      - run: cargo xtask omnode

  # Universal-CPU gate (UNIVERSAL-CPU.md, UCPU-1): scripts/ucpu-gate.sh.
  # Tier 1: release build of EVERY binary (workspace + omnode) as static musl,
  # then the static check (no PT_INTERP / DT_NEEDED), the 2 MiB size budget
  # (readelf, no file(1)) and the grep gate (asm, arch intrinsics, CPU-specific codegen flags).
  # zig cc compiles the bundled SQLite C code for every target.
  ucpu-tier1:
    name: ucpu tier-1 build + static + size (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64-unknown-linux-musl, aarch64-unknown-linux-musl ]
    env:
      UCPU_TIER1: ${{ matrix.target }}
      UCPU_JOBS: 4
      UCPU_NICE: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy
      - name: pinned zig + ucpu-gate grep build static size clippy
        run: cargo xtask ucpu --zig grep build static size clippy

  # Tier 2: cargo check (all targets) for armv7 and aarch64-android. Android's
  # bundled SQLite compiles against zig's musl headers: check never links.
  # A real Android link needs the NDK (docs/ucpu.md).
  ucpu-tier2:
    name: ucpu tier-2 cargo check (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [ armv7-unknown-linux-musleabihf, aarch64-linux-android ]
    env:
      UCPU_TIER2: ${{ matrix.target }}
      UCPU_JOBS: 4
      UCPU_NICE: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: pinned zig + ucpu-gate check
        run: cargo xtask ucpu --zig check

  # Real run: aarch64 + armv7 static binaries of galion-one, tuner,
  # openmind-memory and hermes-gateway (--mock) under qemu-user, probed over
  # loopback HTTP. No network beyond the toolchain, no secrets, no spend.
  ucpu-qemu:
    name: ucpu real run under qemu-user (aarch64, armv7)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UCPU_JOBS: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf
      - name: qemu-user-static (apt) + pinned zig + qemu-user real run
        run: cargo xtask ucpu-qemu --apt-qemu

  repo-check:
    name: repo-check self-eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - name: build repo-check (portable musl), write self-eval.json, report
        run: cargo xtask self-eval
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: self-eval
          path: self-eval.json
          retention-days: 14

  # The four text gates below are std-only Rust (crates/xtask/src/checks.rs),
  # ported 1:1 from the inline bash they replace.
  no-python:
    name: no Python (files or shebangs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
      - name: fail on any *.py file or python shebang
        run: cargo xtask no-python

  cjk-scan:
    name: no CJK characters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
      - name: scan tracked text for Han, Hiragana, Katakana, Hangul
        run: cargo xtask cjk

  zagreb-timestamps:
    name: Zagreb timestamps (best effort, warning only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
      - name: warn on ISO timestamps ending in Z (UTC) in tracked text
        run: cargo xtask zagreb-ts

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
      - name: pinned gitleaks (sha256-verified), full history, values redacted
        run: cargo xtask gitleaks

  license:
    name: license check (MIT)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
      - name: LICENSE present and MIT; workspace declares MIT; crate copies identical
        run: cargo xtask license
