# OpenSSF Scorecard supply-chain analysis.
# Results are published to scorecard.dev (and the README badge) only for public
# repositories, so publishing is switched off while the repository is private.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '27 6 * * 1'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # Private repo: skip entirely (nothing is published, no red runs).
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # publish results
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event.repository.private == false }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: upload to code scanning (public repos, or private with Advanced Security)
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        continue-on-error: true
        with:
          sarif_file: results.sarif
