# Never-unroute hostnames for the cortex HADES route-removal plan
# (family ingress-rule-removal, crates/openmind-nerve/src/protected_hosts.rs).
# Owner decision D-T42-4, confirmed by Mate 2026-10-21 17:04 +02:00: the VPS
# itself, DNS, the mail server and the backup server are never proposed for
# removal; every other hostname may be.
#
# Built into the nerve as the default (include_str!); at run time the file named
# by NERVE_PLANS_PROTECTED_HOSTS_FILE replaces it, and NERVE_PLANS_PROTECTED_HOSTS
# (comma list) adds names under "extra". Hostnames only, never addresses.
#
# Format: <category> = host[, host...]
#   categories: vps, dns, mail, backup (all four required), extra (optional)
#   "*.example.com" protects every name under example.com (not the apex).
#   Matching is case-insensitive; a trailing dot is ignored.
#
# Where the names come from (read-only reads on the VPS, 2026-10-21 17:1x +02:00):
#   vps    hostname -f, /etc/hostname, /etc/hosts and postfix myhostname on the VPS.
#   dns    authoritative NS of every tunnelled zone (all on the same Cloudflare pair).
#          The VPS resolver is configured by address only, so it has no name to list.
#   mail   MX of galion.studio (Zoho EU) and of the other tunnelled zones
#          (Cloudflare Email Routing). Postfix on the VPS is local-only.
#   backup galion-backup.timer writes to /var/backups/galion on the VPS itself and
#          the admin laptop pulls the age-encrypted copy from the VPS: the backup
#          server is the VPS, so its names are listed again here.
# None of these names is a route in the cloudflared ingress today; the list
# makes sure a future route to one of them is never planned for removal.

vps = ip50.vp3.titanaxe.com, ip50, ip50.localdomain, localhost
dns = elaine.ns.cloudflare.com, peyton.ns.cloudflare.com
mail = mx.zoho.eu, mx2.zoho.eu, mx3.zoho.eu, route1.mx.cloudflare.net, route2.mx.cloudflare.net, route3.mx.cloudflare.net
backup = ip50.vp3.titanaxe.com, ip50
