<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>Galion One</title>
<style>
:root{--ob:#05060f;--fg:#f3ede4;--mu:rgba(243,237,228,.56);--line:rgba(243,237,228,.12);--am:#ffb36b;--vi:#9c7bff;--glide:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ob);color:var(--fg)}
body{font:400 1.0625rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;min-height:100dvh}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* One gradient: obsidian with a slow amber-to-violet drift. */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 90% at 50% 110%,#120d1c 0,var(--ob) 60%)}
.sky i{position:absolute;width:90vmax;height:90vmax;border-radius:50%;filter:blur(70px);opacity:.34;will-change:transform}
.sky .a{left:-30vmax;bottom:-45vmax;background:radial-gradient(circle,var(--am) 0,rgba(255,179,107,0) 62%);animation:drift-a 46s ease-in-out infinite alternate}
.sky .v{right:-35vmax;top:-40vmax;background:radial-gradient(circle,var(--vi) 0,rgba(156,123,255,0) 62%);animation:drift-v 58s ease-in-out infinite alternate}
@keyframes drift-a{to{transform:translate(38vmax,-22vmax) scale(1.15)}}
@keyframes drift-v{to{transform:translate(-34vmax,26vmax) scale(1.1)}}
body.think .sky i{opacity:.44;transition:opacity 2s var(--glide)}
/* Chrome: the mark and one quiet menu icon. */
.top{position:fixed;z-index:3;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:max(.75rem,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) .5rem max(1rem,env(safe-area-inset-left))}
.brand{display:inline-flex;align-items:center;gap:.55rem;text-decoration:none;font-size:.9375rem;letter-spacing:-.01em;color:var(--fg);opacity:.86}
.brand svg{width:26px;height:26px}
.ico{display:inline-grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:transparent;cursor:pointer;color:var(--mu);-webkit-tap-highlight-color:transparent;transition:color .3s,background .3s}
.ico:hover,.ico[aria-expanded="true"]{color:var(--fg);background:rgba(243,237,228,.06)}
.ico:focus-visible,.go:focus-visible,.menu a:focus-visible,.menu button:focus-visible{outline:2px solid var(--vi);outline-offset:2px}
.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;margin:-18px 0 0 18px;min-width:8px;height:8px;border-radius:99px;background:var(--am)}
.badge[hidden]{display:none}
/* Menu: one small sheet. */
.menu{position:fixed;z-index:4;top:calc(max(.75rem,env(safe-area-inset-top)) + 3rem);right:max(1rem,env(safe-area-inset-right));width:min(17rem,calc(100vw - 2rem));padding:.4rem;margin:0;list-style:none;border-radius:1.1rem;border:1px solid var(--line);background:rgba(14,12,22,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.5);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .25s var(--glide),transform .25s var(--glide)}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu li[hidden]{display:none}
.menu a,.menu button{display:flex;justify-content:space-between;align-items:center;gap:.75rem;width:100%;min-height:2.75rem;padding:.55rem .85rem;border:0;border-radius:.8rem;background:none;text-align:left;text-decoration:none;font-size:.9375rem;cursor:pointer}
.menu a:hover,.menu button:hover{background:rgba(243,237,228,.07)}
.menu small{color:var(--mu);font-size:.8rem}
.menu hr{border:0;border-top:1px solid var(--line);margin:.3rem .5rem}
/* The one window. */
main{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;max-width:42rem;margin:0 auto;padding:calc(max(.75rem,env(safe-area-inset-top)) + 4rem) max(1.25rem,env(safe-area-inset-right)) 0 max(1.25rem,env(safe-area-inset-left))}
.lead{margin:auto 0 1.4rem;text-align:center;color:var(--mu);font-size:1rem;transition:opacity .6s var(--glide)}
body.talk .lead{display:none}
.stream{flex:1 1 auto;display:none;padding-bottom:1rem}
body.talk .stream{display:block}
.q{margin:2rem 0 .5rem;color:var(--mu);font-size:.9375rem;white-space:pre-wrap;overflow-wrap:anywhere}
.q:first-child{margin-top:.5rem}
.ans{margin:0 0 1rem;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.ans span{opacity:0;animation:rise .7s var(--glide) forwards}
.soft{color:var(--mu)}
@keyframes rise{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
.presence{display:block;width:2.2rem;height:2.2rem;margin:1rem 0;border-radius:50%;background:radial-gradient(circle,rgba(255,200,150,.95) 0,rgba(255,179,107,.45) 35%,rgba(156,123,255,.18) 62%,rgba(156,123,255,0) 72%);animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.78);opacity:.55}50%{transform:scale(1.08);opacity:1}}
/* The prompt field. */
.dock{position:sticky;bottom:0;padding:.5rem 0 max(1.1rem,env(safe-area-inset-bottom));margin-bottom:auto}
body.talk .dock{margin-bottom:0;background:linear-gradient(to top,var(--ob) 55%,rgba(5,6,15,0))}
.field{display:flex;align-items:flex-end;gap:.35rem;padding:.4rem .4rem .4rem 1.15rem;border-radius:1.75rem;border:1px solid rgba(243,237,228,.16);background:rgba(18,15,28,.62);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 0 0 0 rgba(255,179,107,0),0 18px 50px rgba(0,0,0,.35);transition:border-color .4s,box-shadow .6s var(--glide)}
.field:focus-within{border-color:rgba(255,179,107,.42);box-shadow:0 0 0 4px rgba(255,179,107,.07),0 18px 50px rgba(0,0,0,.35)}
body.think .field{box-shadow:0 0 38px rgba(255,179,107,.14),0 0 80px rgba(156,123,255,.12)}
textarea{flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;padding:.62rem 0;max-height:30vh;font-size:1.0625rem;line-height:1.5}
textarea::placeholder{color:var(--mu)}
.go{flex:none;display:inline-grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;cursor:pointer;background:transparent;color:var(--mu);transition:background .3s,color .3s,opacity .3s}
.go svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.go[hidden]{display:none}
#send{background:var(--fg);color:var(--ob)}
#send:disabled{opacity:0;pointer-events:none;width:0;margin-left:-.35rem}
#mic.live{color:var(--ob);background:var(--am);animation:breathe 2.4s ease-in-out infinite}
.pair{display:flex;gap:.5rem;margin:.25rem 0 1rem}
.pair input{flex:1;min-width:0;min-height:44px;padding:0 1rem;border-radius:999px;border:1px solid var(--line);background:rgba(18,15,28,.62);font-size:1rem;letter-spacing:.08em;text-transform:uppercase}
.pair button{min-height:44px;padding:0 1.2rem;border:0;border-radius:999px;background:var(--fg);color:var(--ob);cursor:pointer}
.code{font-size:1.6rem;letter-spacing:.18em;margin:.2rem 0}
@media (prefers-reduced-motion:reduce){.sky i,.presence,#mic.live{animation:none}.ans span{animation:none;opacity:1}.menu,.field,.lead{transition:none}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><i class="a"></i><i class="v"></i></div>
<header class="top">
 <a class="brand" href="/" aria-label="Galion One"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="gm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B8E8FF"/><stop offset=".55" stop-color="#58C4FF"/><stop offset="1" stop-color="#9D8CFF"/></linearGradient></defs><circle cx="32" cy="32" r="30" fill="#0B0F14" stroke="#24303C" stroke-width="1.5"/><path d="M47.6 18.4A20 20 0 1 0 52 32H34" fill="none" stroke="url(#gm)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="32" r="4.2" fill="#B8E8FF"/></svg><span>Galion One</span></a>
 <button type="button" class="ico" id="menu-b" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg><span class="badge" id="menu-dot" hidden></span></button>
</header>
<ul class="menu" id="menu" aria-label="Menu">
 <li><button type="button" id="m-new">New conversation</button></li>
 <li><a href="/room">Conversations<small>history, files, voice</small></a></li>
 <li><a href="/approvals">Approvals<small id="m-appr"></small></a></li>
 <li id="m-pair-li"><button type="button" id="m-pair">Pair this device</button></li>
 <li id="m-invite-li" hidden><button type="button" id="m-invite">Pair another device</button></li>
 <li><a href="/link">Space</a></li>
 <li><button type="button" id="m-install">Install app<small id="m-install-s">on this device</small></button></li>
 <li><hr></li>
 <li><a href="https://galion.app/account">Account<small>galion.app</small></a></li>
</ul>
<main id="main">
 <p class="lead" id="lead">Type or speak, then watch what happens.</p>
 <div class="stream" id="stream" aria-live="polite"></div>
 <div class="dock">
  <form class="field" id="form" autocomplete="off">
   <label class="sr" for="q">Ask anything</label>
   <textarea id="q" rows="1" placeholder="Ask anything&hellip;" enterkeyhint="send"></textarea>
   <button type="button" class="go" id="mic" aria-label="Speak" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
   <button type="submit" class="go" id="send" aria-label="Send" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
 </div>
 <noscript><p class="lead">Turn on JavaScript to use Galion One.</p></noscript>
</main>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var body = document.body, q = $("q"), send = $("send"), mic = $("mic"), form = $("form"), stream = $("stream");
  var menu = $("menu"), menuB = $("menu-b");
  var paired = false, busy = false, waiting = "";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function api(path, opts) {
    opts = opts || {};
    opts.credentials = "same-origin";
    opts.cache = "no-store";
    return fetch(path, opts).then(function (r) {
      return r.text().then(function (t) { var j = null; try { j = JSON.parse(t); } catch (e) {} return { status: r.status, json: j || {} }; });
    });
  }
  function post(path, data) { return api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data || {}) }); }

  // ---- The calm stream.
  function line(cls, text) {
    body.classList.add("talk");
    var p = document.createElement("p");
    p.className = cls;
    p.textContent = text || "";
    stream.appendChild(p);
    end();
    return p;
  }
  function end() { window.scrollTo(0, document.documentElement.scrollHeight); }
  function reveal(el, text, done) {
    if (reduce) { el.textContent = text; done(); return; }
    var parts = text.split(/(\s+)/), i = 0;
    (function step() {
      if (i >= parts.length) { done(); return; }
      var s = document.createElement("span");
      s.textContent = parts.slice(i, i + 4).join("");
      el.appendChild(s);
      i += 4;
      end();
      setTimeout(step, 70);
    })();
  }
  var presence = null;
  function think(on) {
    body.classList.toggle("think", on);
    if (on && !presence) { presence = document.createElement("span"); presence.className = "presence"; presence.setAttribute("role", "status"); presence.setAttribute("aria-label", "Thinking"); stream.appendChild(presence); end(); }
    if (!on && presence) { if (presence.parentNode) presence.parentNode.removeChild(presence); presence = null; }
  }
  function soft(text) { return line("ans soft", text); }

  // ---- Conversation threads: shared with /room on this device.
  var TH = "galion-one-thread", IDLE_MS = 30 * 60 * 1000;
  function getThread() { try { var t = JSON.parse(localStorage.getItem(TH) || "null"); if (t && typeof t === "object") return t; } catch (e) {} return { id: "", last: 0, pinned: false, fresh: false }; }
  function setThread(t) { try { localStorage.setItem(TH, JSON.stringify(t)); } catch (e) {} }
  function threadFor() {
    var t = getThread();
    if (t.fresh || !t.id) return { thread: "", fresh: true };
    if (!t.pinned && Date.now() - (t.last || 0) >= IDLE_MS) return { thread: "", fresh: true };
    return { thread: t.id, fresh: false };
  }

  // ---- Ask: the same path as the Galion One room (POST /admin/say).
  function ask(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    stopMic();
    q.value = ""; grow();
    line("q", text);
    if (!paired) { waiting = text; askPair(); return; }
    busy = true; grow();
    think(true);
    var pick = threadFor();
    post("/admin/say", { text: text, thread: pick.thread, fresh: pick.fresh }).then(function (r) {
      think(false);
      if (r.status === 401 || r.json.error === "pair") { busy = false; grow(); paired = false; paint(); waiting = text; askPair(); return; }
      if (r.json.thread) { var was = getThread(); setThread({ id: r.json.thread, last: Date.now(), pinned: was.id === r.json.thread && !!was.pinned, fresh: false }); }
      var say = (r.json.say || "").trim();
      if (say === "Wait") { done(); soft("Still finishing the last answer. Try again in a moment."); return; }
      if (!say || say === "Again") { done(); soft("No answer came back. Try again."); return; }
      reveal(line("ans", ""), say, done);
    }).catch(function () { think(false); done(); soft("No connection. Check your network and try again."); });
  }
  function done() { busy = false; grow(); }

  // ---- Pairing (the room's own /pair route).
  function askPair() {
    var old = $("pairf"); if (old) old.parentNode.removeChild(old);
    soft(waiting ? "First, pair this device. Enter your pairing code and your question goes right after." : "Enter your pairing code to pair this device.");
    var f = document.createElement("form");
    f.className = "pair"; f.id = "pairf"; f.setAttribute("autocomplete", "off");
    f.innerHTML = '<label class="sr" for="code">Pairing code</label><input id="code" placeholder="Pairing code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" enterkeyhint="go"><button type="submit">Pair</button>';
    stream.appendChild(f); end();
    var c = $("code"); c.focus();
    f.addEventListener("submit", function (e) {
      e.preventDefault();
      var code = c.value.trim(); if (!code) return;
      post("/pair", { code: code }).then(function (r) {
        if (r.json.ok) {
          f.parentNode.removeChild(f); paired = true; paint(); soft("Paired. Welcome.");
          if (waiting) { var t = waiting; waiting = ""; q.value = t; ask(t); }
          return;
        }
        soft(r.json.error === "later" ? "Too many tries. Wait 15 minutes, then try again." : "That code did not work.");
      }).catch(function () { soft("No connection."); });
    });
  }

  // ---- The field.
  function grow() {
    q.style.height = "auto";
    q.style.height = Math.min(q.scrollHeight, window.innerHeight * 0.3) + "px";
    send.disabled = busy || !q.value.trim();
  }
  q.addEventListener("input", grow);
  q.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(q.value); } });
  form.addEventListener("submit", function (e) { e.preventDefault(); ask(q.value); });

  // ---- Voice: the browser's own speech recognition, only where it exists.
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null, base = "";
  if (SR) mic.hidden = false;
  function stopMic() { if (rec) { try { rec.stop(); } catch (e) {} } }
  mic.addEventListener("click", function () {
    if (rec) { stopMic(); return; }
    try { rec = new SR(); } catch (e) { mic.hidden = true; return; }
    rec.lang = navigator.language || "en-GB";
    rec.interimResults = true;
    rec.continuous = false;
    base = q.value.trim();
    rec.onresult = function (e) {
      var t = "";
      for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
      q.value = (base ? base + " " : "") + t.trim(); grow();
    };
    rec.onerror = function (e) { if (e && (e.error === "not-allowed" || e.error === "service-not-allowed")) soft("The microphone is blocked for this site. You can still type."); };
    rec.onend = function () { rec = null; mic.classList.remove("live"); mic.setAttribute("aria-pressed", "false"); mic.setAttribute("aria-label", "Speak"); q.focus(); };
    try { rec.start(); mic.classList.add("live"); mic.setAttribute("aria-pressed", "true"); mic.setAttribute("aria-label", "Stop"); } catch (e) { rec = null; }
  });

  // ---- Menu.
  function openMenu(on) { menu.classList.toggle("open", on); menuB.setAttribute("aria-expanded", on ? "true" : "false"); }
  menuB.addEventListener("click", function (e) { e.stopPropagation(); openMenu(!menu.classList.contains("open")); });
  document.addEventListener("click", function (e) { if (!menu.contains(e.target)) openMenu(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") openMenu(false); });
  $("m-new").addEventListener("click", function () {
    if (busy) return;
    setThread({ id: "", last: 0, pinned: false, fresh: true });
    stream.textContent = ""; body.classList.remove("talk"); openMenu(false); q.focus();
  });
  $("m-pair").addEventListener("click", function () { openMenu(false); waiting = ""; askPair(); });
  $("m-invite").addEventListener("click", function () {
    openMenu(false);
    post("/pair/invite").then(function (r) {
      if (!r.json.code) { soft("Could not make a code. Try again."); return; }
      var hh; try { hh = new Intl.DateTimeFormat("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Zagreb" }).format(new Date(r.json.expires)); } catch (e) { hh = ""; }
      soft("On the new device open one.galion.app, tap Pair this device in the menu and enter this code. It works once" + (hh ? ", until " + hh + " (Zagreb time)." : "."));
      line("ans code", r.json.code);
    }).catch(function () { soft("No connection."); });
  });
  // Install: the browser's own prompt where it offers one, otherwise one line of help.
  var deferred = null;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; });
  var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  if (standalone) $("m-install-s").textContent = "installed";
  $("m-install").addEventListener("click", function () {
    openMenu(false);
    if (standalone) { soft("Galion One is already installed on this device."); return; }
    if (deferred) { deferred.prompt(); deferred = null; return; }
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    soft(ios ? "In Safari, tap Share, then Add to Home Screen." : "Use your browser menu and choose Install app or Add to Home screen.");
  });

  // ---- State.
  function paint() { $("m-pair-li").hidden = paired; $("m-invite-li").hidden = !paired; }
  function approvals() {
    api("/api/approvals/count").then(function (r) {
      var n = r.status === 200 && typeof r.json.ready === "number" ? r.json.ready : 0;
      $("m-appr").textContent = n ? n + " waiting" : "";
      $("menu-dot").hidden = !n;
    }).catch(function () {});
  }
  api("/me").then(function (r) { paired = !!r.json.you; paint(); if (paired) approvals(); }).catch(function () { paint(); });
  grow();
})();
</script>
</body>
</html>
