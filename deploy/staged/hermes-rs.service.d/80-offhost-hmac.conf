# STAGED, NOT INSTALLED. Proposal for Slavik's approval (wave-4 slot 340,
# 2026-10-28 CET +01:00). Nothing on the VPS reads this file.
# Off-host snapshot sealing key for hermes-rs, handed in as a systemd
# credential. Runbook and rotation steps: docs/ops/hermes-offhost-keyrot.md.
#
# This drop-in only provides the key. It does NOT turn the off-host feature on
# (HERMES_OFFHOST / HERMES_OFFHOST_PATH / HERMES_OFFHOST_URI stay owner
# decision D1). Without a store set, the key is loaded and checked but unused.
#
# Key file (made on the host, never in git, never printed; see the runbook):
#   install -d -m 0700 -o root -g root /etc/galion/offhost
#   (umask 077; head -c 48 /dev/urandom > /etc/galion/offhost/hmac.key)
# The same key file goes to the standby host, same path.
#
# Install (only after approval):
#   install -m 0644 80-offhost-hmac.conf /etc/systemd/system/hermes-rs.service.d/
#   systemctl daemon-reload   (then restart at an approved time)
# Rollback: rm /etc/systemd/system/hermes-rs.service.d/80-offhost-hmac.conf
#   && systemctl daemon-reload (then restart at an approved time)

[Service]
# systemd copies the file into a private, read-only ramfs at
# $CREDENTIALS_DIRECTORY/offhost-hmac (mode 0400, owner = the unit's user),
# outside the store and outside /opt/galion. %d expands to that directory
# (systemd >= 248; the VPS has 255). The gateway's key checks (regular file,
# 0600 or stricter, 32 B..4 KiB, not in the store) pass for it as is.
LoadCredential=offhost-hmac:/etc/galion/offhost/hmac.key
Environment=HERMES_OFFHOST_HMAC_FILE=%d/offhost-hmac

# --- Rotation window (uncomment ONLY during a rotation; runbook step R3) ---
# The previous key is verify-only: every new snapshot is sealed with the
# current key, so the first heartbeat re-seals the store. The window must end
# (Europe/Zagreb RFC 3339, +01:00/+02:00, at most 30 days ahead).
#LoadCredential=offhost-hmac-prev:/etc/galion/offhost/hmac.prev.key
#Environment=HERMES_OFFHOST_HMAC_PREV_FILE=%d/offhost-hmac-prev
#Environment=HERMES_OFFHOST_HMAC_PREV_UNTIL=2026-11-04T12:00:00+01:00
