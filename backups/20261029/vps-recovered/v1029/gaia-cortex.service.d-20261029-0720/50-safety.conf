# 2026-10-21 (Mate; owner Slavik approved go-live): gaia-cortex safety env.
#  - automatic fixes SIMULATE ONLY: CORTEX_ACTIONS=dry-run (requests to nerve /actions carry dry_run=true)
#  - LLM advisor ON via River AI only (DeepSeek-V4.1-Flash, $15 hard cap, 6 calls/h, 400 max tokens;
#    see /etc/gaia-cortex/config.json). Called only on ambiguous high-severity incidents, never on a timer.
#    Spend ledger: /var/lib/gaia-cortex/llm-spend.json
#  - key: /etc/gaia-cortex/river.env (0600 root, only RIVER_API_KEY, copied on-box from hermes .env)
#  - OpenRouter forbidden: endpoint guard in code + no OPENROUTER/OPENAI/ANTHROPIC vars here.
#  - pull adapter off; nerve stream on (404 on a polling nerve -> retry every 600 s).
# Rollback (LLM off only): set CORTEX_LLM_ENABLED=0 below; systemctl daemon-reload; systemctl restart gaia-cortex
[Service]
Environment=CORTEX_ACTIONS=dry-run
Environment=CORTEX_LLM_ENABLED=1
Environment=CORTEX_NERVE_URL=http://127.0.0.1:8670
Environment=CORTEX_NERVE_STREAM=1
Environment=CORTEX_PULL_EVERY_S=0
Environment=CORTEX_LISTEN=127.0.0.1:8674
Environment=CORTEX_DATA_DIR=/var/lib/gaia-cortex
EnvironmentFile=/etc/gaia-cortex/river.env
UnsetEnvironment=OPENROUTER_API_KEY OPENROUTER_BASE_URL OPENROUTER_MODEL OPENAI_API_KEY OPENAI_BASE_URL OPENAI_API_BASE ANTHROPIC_API_KEY ANTHROPIC_BASE_URL ANTHROPIC_AUTH_TOKEN NERVE_TELEGRAM_ENV
