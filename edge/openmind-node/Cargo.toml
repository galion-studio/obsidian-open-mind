[package]
name = "openmind-node"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "omnode: phone/LAN-side node of the Obsidian Open Mind Stack (device identity, polite LAN discovery, mDNS announce, pairing payload, CPU-only agent sandbox)."
publish = false

# Standalone on purpose: its own (empty) workspace, so it never joins or edits
# the OpenMind workspace Cargo.toml / Cargo.lock.
[workspace]

[[bin]]
name = "omnode"
path = "src/main.rs"

[dependencies]
# Shared std-only base64url (no dependencies of its own by default).
galion-common = { path = "../../crates/galion-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.2"
libc = "0.2"
socket2 = { version = "0.5", features = ["all"] }
mdns-sd = { version = "0.13", default-features = false }
qrcode = { version = "0.14", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
