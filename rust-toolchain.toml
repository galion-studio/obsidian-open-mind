#
# The compiler CI and local rustup use. Channel 1.89.0 is the workspace
# MSRV (Cargo.toml rust-version), not a floating stable. Miri workflows
# pass an explicit nightly and do not use this file.
# Choice and the 1.83 / 1.87 / 1.88 measurements:
# docs/swarm-9/2026-11-15/core/rust-hygiene.md

[toolchain]
channel = "1.89.0"
components = ["clippy", "rustfmt"]
profile = "minimal"
