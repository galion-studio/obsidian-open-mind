[package]
name = "galion-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared std-only helpers: SHA-256, hex, base64, CPython-compatible JSON output, Europe/Zagreb RFC 3339 time and a small hardened HTTP/1.1 server and client."

[features]
default = []
# `jsonout` over serde_json::Value for the crates that already use serde_json
# (desk-hermes, link-watch). Off by default so the crate stays std-only.
serde-json = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# Cross-check only: the std-only time module must agree with chrono-tz.
zagreb-time = { path = "../zagreb-time" }

