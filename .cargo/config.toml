# DESK-ID: openmind.UCPU-1
#
# Workspace-wide cargo settings. Portable only: no CPU-pinning codegen flags
# (UNIVERSAL-CPU.md). The single rustflag below is a cfg
# that selects a portable pure-Rust backend, not a CPU feature flag.

[env]
# rusqlite "bundled" (libsqlite3-sys 0.30) compiles the SQLite amalgamation
# with FTS3, R*Tree, DBSTAT, STAT4, SOUNDEX, column metadata and runtime
# extension loading switched on. No workspace crate uses any of them
# (grep: no fts3/rtree/dbstat/soundex/load_extension/column_metadata in
# crates/*/src). Turning them off saves ~130 KB of C code per binary that
# links SQLite and gets hermes-gateway under the 2 MiB budget (docs/ucpu.md).
# Kept on purpose: FTS5 and JSON (the Python Hermes state.db may hold FTS5
# tables; the legacy DB is opened read-only, but keep the module anyway).
# OMIT_LOAD_EXTENSION also drops the dlopen() path, which a static musl
# binary cannot use anyway.
LIBSQLITE3_FLAGS = "-USQLITE_ENABLE_FTS3 -USQLITE_ENABLE_FTS3_PARENTHESIS -USQLITE_ENABLE_RTREE -USQLITE_ENABLE_DBSTAT_VTAB -USQLITE_ENABLE_STAT4 -USQLITE_SOUNDEX -USQLITE_ENABLE_COLUMN_METADATA -USQLITE_ENABLE_LOAD_EXTENSION -DSQLITE_OMIT_LOAD_EXTENSION"

# curve25519-dalek (via ed25519-dalek in crates/hades-gate) would otherwise
# compile its AVX2 SIMD backend on x86_64. Project rule: no SIMD. "serial"
# is the portable pure-Rust backend on every target. A RUSTFLAGS env var
# replaces this list; crates/hades-gate/tests/simd_free.rs fails if it does.
[build]
rustflags = ["--cfg", "curve25519_dalek_backend=\"serial\""]

# Cross linkers (slot 145, toolchain-aarch64, 2026-10-21 CEST +02:00).
# Without this, `cargo build --target aarch64-unknown-linux-musl` falls back
# to the host `cc` (x86_64 GNU ld), which fails with
# "unrecognized option '--fix-cortex-a53-843419'". Every swarm agent had to
# export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=rust-lld by hand.
# rust-lld ships with every rustup toolchain (rustlib/<host>/bin), rustc finds
# it there on its own, and the musl targets bring their own self-contained
# crt objects and libc.a, so no cross gcc is needed. armv7 musl has the same
# problem and the same fix. An env var CARGO_TARGET_<TRIPLE>_LINKER still
# overrides this (scripts/ucpu-gate.sh sets the same value). This is only a
# linker choice: no codegen or CPU flags (UNIVERSAL-CPU.md), and it does not
# touch [build] rustflags above (target.<triple>.rustflags would replace them).
# C code (bundled SQLite in desk-hermes, hermes-rs, hermes-gateway,
# one-defence, openmind-memory) still needs a C cross compiler for these
# targets: see docs/toolchain-aarch64.md (zig cc, as in scripts/ucpu-gate.sh).
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"

# `cargo xtask test` = the default workspace test recipe (slot 335, D-320-2):
# leaves openmind-sandbox / hermes-tools / cgroup-detect out where the host
# lacks their kernel features or is sandbox-VPS-only. docs/dev/test-recipe.md.
[alias]
xtask = "run --quiet -p xtask --"
