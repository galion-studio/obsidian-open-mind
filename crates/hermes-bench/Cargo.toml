[package]
name = "hermes-bench"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "hermes-rs adapters for the B1 banking / B2 Wall Street / B3 vending benchmark tool sets, and a `hermes-bench` runner with a pluggable agent (scripted, mock LLM, opt-in OpenRouter). Local mock / paper / sim only; no money-moving tool exists."

[[bin]]
name = "hermes-bench"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }
# default-features = false: no bundled SQLite (C) build; the bench needs no session DB.
hermes-rs = { path = "../hermes-rs", default-features = false }
bench-banking = { path = "../bench-banking" }
galion-wallstreet = { path = "../galion-wallstreet" }
galion-vending = { path = "../galion-vending" }
galion-bench = { path = "../galion-bench" }
bench-scoreboard = { path = "../bench-scoreboard" }
zagreb-time = { path = "../zagreb-time" }
