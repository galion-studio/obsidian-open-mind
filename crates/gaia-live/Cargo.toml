#
# Gaia live. M1 (lib.rs): read-only health probes of the real services
# (HTTP GET only, `systemctl is-active` only, file metadata only).
# M2 (heal.rs, nerve.rs; the test service is crates/gaia/src/bin/gaia-dummy.rs): the first apply path, scoped to
# box-local TEST services on 127.0.0.1:19000-19999 behind a HADES approval
# token and a 3-restarts-per-hour cap, with nerve events over loopback.
# Never calls systemctl to change anything, never signals a process.

[package]
name = "gaia-live"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gaia live: read-only health of the stack (M1) and an approval-gated, rate-capped restart path for box-local test services that records to the nerve (M2)."

[dependencies]
gaia-core = { path = "../gaia-core" }
zagreb-time = { path = "../zagreb-time" }
serde_json = { workspace = true }
