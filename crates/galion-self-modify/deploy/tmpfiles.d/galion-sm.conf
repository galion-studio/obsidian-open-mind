# Directories for the approval system. FILE ONLY: not installed.
# Install (after Slavik's yes): cp to /etc/tmpfiles.d/ && systemd-tmpfiles --create galion-sm.conf
# Public keys stay root-owned 0444 in /etc/hermes-self-modify/ (stack.pub, sandbox-v2.pub, owner.pub).
d /var/lib/galion-sm-sign            0700 galion-sm-sign  galion-sm-sign  -
d /var/lib/galion-sm-sign/keys       0700 galion-sm-sign  galion-sm-sign  -
d /var/lib/galion-sm-test            0750 galion-sm-test  galion-sm-test  -
d /var/lib/galion-sm-deploy          0700 root            root            -
d /var/lib/galion-sm-deploy/backups  0700 root            root            -
d /var/lib/openmind-hermes/keys      0700 openmind-hermes openmind-hermes -
