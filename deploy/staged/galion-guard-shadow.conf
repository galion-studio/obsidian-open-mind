# STAGED ONLY - not installed. systemd drop-in for the SHADOW phase:
#   /etc/systemd/system/galion-guard.service.d/shadow.conf
# Shadow mode never touches nftables, so it does not get CAP_NET_ADMIN or
# netlink sockets at all: even a bug could not write a firewall rule.
# Remove this drop-in at cutover (docs/guard-shadow.md, phase 2).
[Service]
CapabilityBoundingSet=CAP_DAC_READ_SEARCH
RestrictAddressFamilies=AF_UNIX
