# STAGED, NOT INSTALLED (wave 4 slot 351, 2026-10-28 CET +01:00). Owner decision D-336-2 / D-351-1 open.
# Drop-in for console.service (live :8080) and console-rust-primary.service (:18080):
#   /etc/systemd/system/console.service.d/bank.conf
# Effect: GET/HEAD /api/v1/bank (exact path, after the console API gate) is proxied to the
# hermes-rs bank listener on loopback. The console stays key-free: it reads no key file and
# calls no provider. Precondition: hermes-bank.conf installed and 127.0.0.1:8649 answering.
# Before install: fold F-351-1 (strip Cookie/Authorization on --data-upstream) into the console build.
# ExecStart must be reset and restated in full (systemd drop-in rule); this mirrors the live argv
# of 2026-10-28 04:05 CET (galion-console-serve-2d846fb8) plus the two new flags.
# --data-upstream needs a binary that has it (console-dist-arena-bank 7888d8fb or later); the live
# 2d846fb8 build does not, so this drop-in goes in with the next console deploy, not before.
# D-336-1 (--arena-root /workspace/arena) is a separate decision; arena is read in-process, not via --data-upstream.
[Service]
ExecStart=
ExecStart=/opt/galion/rust/bin/galion-console-serve-NEW --bind 127.0.0.1:8080 --dist /opt/galion/console-dist --ui rust --local-api --pulse 127.0.0.1:8091 --desk 127.0.0.1:8646 --data-upstream 127.0.0.1:8649 --data-path /api/v1/bank --quiet
# Rollback: rm the drop-in, systemctl daemon-reload, restart console (page falls back to the honest
# "HTTP 404/502 ... no bank reader" empty state; nothing else depends on it).
