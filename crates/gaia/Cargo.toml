[package]
name = "gaia"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
description = "Gaia CLI: wires GAIA core to its nine subordinate functions; status, tick, the deterministic Faro-plague scenario (with --full-power), status --live (read-only) and heal-tick (approval-gated restart of box-local test services, nerve-recorded), JSON out."

[[bin]]
name = "gaia"
path = "src/main.rs"

# Throwaway loopback test service for `gaia heal-tick` (ports 19000-19999 only).
[[bin]]
name = "gaia-dummy"
path = "src/bin/gaia-dummy.rs"

[dependencies]
gaia-core = { path = "../gaia-core", version = "0.1.0" }
gaia-hades = { path = "../gaia-hades", version = "0.1.0" }
gaia-minerva = { path = "../gaia-minerva", version = "0.1.0" }
gaia-apollo = { path = "../gaia-apollo", version = "0.1.0" }
gaia-hephaestus = { path = "../gaia-hephaestus", version = "0.1.0" }
gaia-artemis = { path = "../gaia-artemis", version = "0.1.0" }
gaia-poseidon = { path = "../gaia-poseidon", version = "0.1.0" }
gaia-aether = { path = "../gaia-aether", version = "0.1.0" }
gaia-demeter = { path = "../gaia-demeter", version = "0.1.0" }
gaia-eleuthia = { path = "../gaia-eleuthia", version = "0.1.0" }
gaia-live = { path = "../gaia-live", version = "0.1.0" }
serde_json = { workspace = true }
zagreb-time = { path = "../zagreb-time", version = "0.1.0" }
# Signed, expiring, single-use, scope-bound approvals for heal-tick
# (adapter::check_gaia + replay ledger). Pure Rust; see docs/third-party/gaia-hades-tokens.md.
hades-gate = { path = "../hades-gate", version = "0.1.0" }
