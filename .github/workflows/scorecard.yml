# OpenSSF Scorecard supply-chain analysis.
# Results are published to scorecard.dev (and the README badge) only for public
# repositories, so publishing is switched off while the repository is private.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '27 6 * * 1'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # Private repo: skip entirely (nothing is published, no red runs).
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # publish results
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event.repository.private == false }}
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: upload to code scanning (public repos, or private with Advanced Security)
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: results.sarif
