# /etc/systemd/system/galion-backup.service.d/offsite.conf (ws/offsite)
# After each successful backup: encrypt to the offsite age recipient.
# Always (even on failure): restore traverse-only perms for galion-offsite on /var/backups/galion.
[Service]
ExecStartPost=/opt/galion/offsite/galion-offsite-encrypt.sh
ExecStopPost=/opt/galion/offsite/galion-offsite-encrypt.sh --perms-only
