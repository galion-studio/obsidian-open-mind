#
# STAGED ONLY (wave-4 slot 313, swarm/console-admin-flags-stage, owner
# decision D-303-1). NOT installed on the VPS. Target path when approved:
#   /etc/systemd/system/console.service.d/60-admin-store.conf
# Base unit: live /etc/systemd/system/console.service (as-built mirror in
# deploy/console-rust-serve/live/console.service).
#
# What it changes (only these keys; everything else stays from the base):
# - ExecStart: same argv as live plus --admin-store/--admin-mirror, on the
#   board+admin build galion-console-serve-9c0f9d1a (2d846fb8 rejects the
#   new flags and would crash-loop). The empty ExecStart= resets the list.
# - ReadWritePaths: the store dirs (atomic temp+rename needs the directory)
#   inside ProtectSystem=strict / ProtectHome=read-only. Without it, paired
#   cookies still verify but new pairing fails closed (503).
# Rollback: rm this file; systemctl daemon-reload; systemctl restart console.service
[Service]
ExecStart=
ExecStart=/opt/galion/rust/bin/galion-console-serve-9c0f9d1a \
  --bind 127.0.0.1:8080 \
  --dist /opt/galion/console-dist \
  --ui rust \
  --local-api \
  --pulse 127.0.0.1:8091 \
  --desk 127.0.0.1:8646 \
  --admin-store /root/galion-secrets/admin-device.json \
  --admin-mirror /workspace/galion-light/secrets/persist/admin-device.json \
  --quiet
ReadWritePaths=/root/galion-secrets /workspace/galion-light/secrets/persist
