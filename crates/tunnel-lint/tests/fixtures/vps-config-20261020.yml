# Secrets-free copy of the VPS cloudflared ingress config, read 2026-10-20 20:35 +02:00.
# Tunnel id zeroed, credentials-file path replaced; the credentials file was never read.
tunnel: 00000000-0000-0000-0000-000000000000
credentials-file: /nonexistent/REDACTED-NOT-COPIED.json

# Global WebSocket settings for better connection stability
originRequest:
  noTLSVerify: true
  connectTimeout: 30s
  tcpKeepAlive: 30s
  keepAliveConnections: 100
  keepAliveTimeout: 90s

ingress:
