# Hermes self-change approval accounts (design 2026-10-31). FILE ONLY: not installed.
# Install (after Slavik's yes): cp to /etc/sysusers.d/ && systemd-sysusers galion-sm.conf
#
# galion-sm-test: builds and runs tested code. Holds NO key, no network, no login,
#                 not in openmind-hermes / galion-gate / galion-sm-sign groups.
# galion-sm-sign: holds the NEW sandbox key (sandbox-v2.seed). Never executes tested
#                 code (galion-sm-sign has no process-spawning code path). No login.
u galion-sm-test - "Hermes self-change test runner (no keys, no network)" /var/lib/galion-sm-test /usr/sbin/nologin
u galion-sm-sign - "Hermes self-change signer (sandbox key, runs no tested code)" /var/lib/galion-sm-sign /usr/sbin/nologin
