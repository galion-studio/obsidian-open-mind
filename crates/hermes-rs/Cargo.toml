[package]
name = "hermes-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust port of the parts of hermes-agent 0.21.4 Galion uses: OpenAI-compatible API, agent loop, delegate_task caps, sessions, cron, stdio MCP, spend."

[features]
# `sqlite` gives read-compat with the Python state.db. It compiles the SQLite
# amalgamation (C), so it needs a C compiler for the target. Cross builds
# for phones / Pi without a C cross toolchain use --no-default-features and
# the pure-Rust JSONL session store.
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[dependencies]
galion-common = { path = "../galion-common" }
serde_json = { workspace = true } # preserve_order: pinned in the root Cargo.toml
openmind-persona = { path = "../openmind-persona" }
nerve-client = { path = "../nerve-client" }
rusqlite = { version = "0.32", default-features = false, features = ["bundled"], optional = true }
# Device enrollment (src/enroll): Ed25519 strict verify, SHA-256, OS randomness.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
# force-soft-compact (slot 329): portable rolled-loop SHA-256/512, no
# SHA-NI/SSE/AVX2 intrinsics or cpufeatures runtime dispatch (no-SIMD rule,
# same idea as hades-gate force-soft); ~20 KB smaller hermes-gateway.
sha2 = { version = "0.10", default-features = false, features = ["std", "force-soft-compact"] }
getrandom = "0.2"
