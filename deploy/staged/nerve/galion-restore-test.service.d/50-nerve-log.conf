# STAGED (wave-4 slot 378, 2026-10-28 CET +01:00): NOT INSTALLED.
# Drop-in for the staged galion-restore-test.service (slot 326/361,
# D-361-1 step 4): keep the stdout+stderr of the LAST restore-test run in
# /var/log/galion/restore-test.log so the nerve `restore-test` component
# (kind "restore", deploy/staged/nerve/components-live.json) can judge it.
# systemd (PID 1) opens the file before the sandbox starts, so
# ProtectSystem=strict in the unit does not block it; truncate: = one run per
# file. The file holds archive and file NAMES only (no file content).
# Install: /etc/systemd/system/galion-restore-test.service.d/50-nerve-log.conf
# then `systemctl daemon-reload` (owner go, D-378-1).
# Rollback: remove this file and daemon-reload (output goes back to journald).
[Service]
LogsDirectory=galion
LogsDirectoryMode=0750
StandardOutput=truncate:/var/log/galion/restore-test.log
StandardError=inherit
