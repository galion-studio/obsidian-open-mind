[package]
name = "desk-hermes"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust port of the desk-hermes mind snap (was /opt/galion/bin/desk-hermes.py)"

[[bin]]
name = "desk-hermes"
path = "src/main.rs"

[dependencies]
galion-common = { path = "../galion-common", features = ["serde-json"] }
# The ticket notes `bundled` is not required and that the system libsqlite3 is
# fine. On this box there is no pkg-config, no sqlite3.h and no libsqlite3.so
# (only the versioned libsqlite3.so.0 runtime), so libsqlite3-sys cannot link
# against the system library. `bundled` compiles the vendored SQLite
# amalgamation and is therefore required here. state.db is still opened
# READ-ONLY regardless.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
