<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Obsidian Open Mind mark (for dark backgrounds)</title>
  <!-- Faceted obsidian shard with an open, lit core. Hand-written SVG. MIT, Galion / galion-studio. -->
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8E8FF"/>
      <stop offset="0.55" stop-color="#58C4FF"/>
      <stop offset="1" stop-color="#0B5FA5"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A6378"/>
      <stop offset="1" stop-color="#1B2633"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9FDCFF"/>
      <stop offset="0.5" stop-color="#58C4FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#58C4FF" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="round">
    <polygon points="256,40 392,150 296,252 256,200" fill="url(#hi)"/>
    <polygon points="392,150 410,330 296,252" fill="#2B3A4A"/>
    <polygon points="410,330 262,472 258,306 296,252" fill="#1A2430"/>
    <polygon points="262,472 118,360 216,256 258,306" fill="#121A23"/>
    <polygon points="118,360 104,170 216,256" fill="#202C39"/>
    <polygon points="104,170 256,40 256,200 216,256" fill="#34475A"/>
    <!-- facet seams -->
    <g fill="none" stroke="#0B0F14" stroke-width="3" stroke-opacity="0.7">
      <path d="M256,40 L256,200 M392,150 L296,252 M410,330 L296,252 M262,472 L258,306 M118,360 L216,256 M104,170 L216,256"/>
    </g>
    <!-- open core -->
    <polygon points="256,200 296,252 258,306 216,256" fill="url(#core)"/>
    <polygon points="256,200 296,252 256,246" fill="#FFFFFF" fill-opacity="0.35"/>
    <!-- rim light -->
    <polygon points="256,40 392,150 410,330 262,472 118,360 104,170" fill="none" stroke="url(#rim)" stroke-width="6"/>
  </g>
</svg>
