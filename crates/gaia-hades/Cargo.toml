[package]
name = "gaia-hades"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gaia HADES: guarded teardown, rollback, kill switch, heal-apply and secret-rotation PLANS. Dry-run by default; approval token required; never executes or deletes."

[dependencies]
gaia-core = { path = "../gaia-core" }

# Option B typed plans (hades-plan/v1 grammar) and the gate action map.
# In-workspace path dependency, no new third-party crates (gaia already
# links hades-gate). See docs/third-party/gaia-hades-typed.md.
hades-gate = { path = "../hades-gate" }

[dev-dependencies]
# Same spec as hades-gate (already in Cargo.lock): sign throwaway test tokens.
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
