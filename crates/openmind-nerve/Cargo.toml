[package]
name = "openmind-nerve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NERVE + CORTEX: the Galion signals hub. Pull probes (health endpoints, systemd, journald, access logs) and POST /signal ingest, incident correlation, cortex view (vulnerabilities, bleeding, DDoS rate anomalies), self-eval scoring, one loopback JSON API and a dashboard. Also the append-only JSONL nerve writer. std + serde + serde_json + zagreb-time."

[lib]
path = "src/lib.rs"

[[bin]]
name = "openmind-nerve"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
semver = "1"
zagreb-time = { path = "../zagreb-time" }
galion-common = { path = "../galion-common" }

[dev-dependencies]
# T4.2 tests: every plan template must pass the real hades-gate admin-safety review.
hades-gate = { path = "../hades-gate" }
# Sign throwaway test approvals (same version and features as hades-gate; already in Cargo.lock).
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
zagreb-time = { path = "../zagreb-time" }
openmind-schema = { path = "../openmind-schema" }
toml = { workspace = true }
