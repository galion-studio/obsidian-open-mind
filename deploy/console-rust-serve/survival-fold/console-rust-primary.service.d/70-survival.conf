# STAGED ONLY (wave-4 slot 425, console-survival-fold). NOT installed, NOT deployed.
# Console V2 prep for D-389-1 + D-389-2 (interval, 900 s) + D-408-1 (survival card on /bank).
# Applies ON TOP of the drop-in installed 2026-10-28 17:29 +0100 (mirror:
# deploy/console-rust-serve/live/console-rust-primary.service.d/60-admin-store.conf):
#   same argv as live 5aa31927, new binary built from swarm/console-survival-fold code 1767bafa
#   (= live 5aa31927 + survival-refresh-writer d25f8479 + console-survival-card 1b7e3e8b),
#   plus the in-console survival.json refresh (interval mode, 900 s, no systemd timer).
# PRIMARY (:18080) ONLY. Never put the --survival-writer flags on console.service (:8080):
# one writer per file; the fallback may get --survival-file alone (status/card only).
#
# The writer is the already-installed Rust /opt/galion/rust/bin/galion-survival (S4.7). With
# default paths it reads the OpenRouter key itself (GET /api/v1/key, free, no spend); the
# console never reads the key, runs it with a cleared env, discards its stdout, kills it after
# 90 s and backs off a full interval after a failure.
# D-389-3 (HOLD park): galion-survival lane() may try to rewrite /opt/galion/hermes/modes.json;
# this drop-in deliberately does NOT open /opt/galion/hermes, so under ProtectSystem=strict that
# write keeps failing silently (survival.json is still written).
#
# Install (owner only, after D-389-1/D-408-1; binary galion-console-serve-1767bafa + .sha256
# published next to -5aa31927 first):
#   install -m 0644 70-survival.conf /etc/systemd/system/console-rust-primary.service.d/70-survival.conf
#   systemctl daemon-reload && systemctl restart console-rust-primary.service
# Rollback: rm that file, daemon-reload, restart (back to the 60-admin-store.conf argv, 5aa31927).
[Service]
ExecStart=
ExecStart=/opt/galion/rust/bin/galion-console-serve-1767bafa \
  --bind 127.0.0.1:18080 \
  --dist /opt/galion/console-dist \
  --ui rust \
  --local-api \
  --pulse 127.0.0.1:8091 \
  --desk 127.0.0.1:8646 \
  --admin-store /root/galion-secrets/admin-device.json \
  --admin-mirror /workspace/galion-light/secrets/persist/admin-device.json \
  --arena-root /workspace/arena \
  --quiet \
  --survival-file /opt/galion/galion-light/state/survival.json \
  --survival-writer /opt/galion/rust/bin/galion-survival \
  --survival-refresh-s 900 \
  --survival-mode interval
# ProtectSystem=strict makes /opt read-only; the writer replaces state/survival.json
# (+ state/eval/survival.txt). "-" = do not fail the unit if the folder is missing.
# Adds to (does not replace) the admin-store ReadWritePaths of 60-admin-store.conf.
ReadWritePaths=-/opt/galion/galion-light/state
