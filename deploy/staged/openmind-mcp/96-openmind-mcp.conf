# Drop-in for hermes-rs.service (swarm/openmind-mcp-rust, 2026-10-29 +01:00).
# Target: /etc/systemd/system/hermes-rs.service.d/96-openmind-mcp.conf
# Switches the Hermes MCP client on and pins the Obsidian vault read-only
# for Hermes and every MCP child it starts. Adds to (does not replace) the
# InaccessiblePaths of 95-cpu-always.conf.
# Rollback: rm this file; systemctl daemon-reload; systemctl restart hermes-rs.
[Service]
Environment=HERMES_RS_MCP=1
ReadOnlyPaths=/opt/galion/galion-light/docs/build-session
