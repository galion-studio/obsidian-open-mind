#
# VPS-only runner for the real-life problem scenarios in
# docs/real-tests/sandbox-real-problems.md. Not a member of the root
# workspace (own [workspace] table): it is built as a static
# x86_64-unknown-linux-musl binary on the box and RUN ONLY ON THE VPS
# (standing rule sandbox_vps_only). No new third-party dependencies:
# libc is already used by openmind-sandbox.
[package]
name = "sandbox-real-problems"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]
openmind-sandbox = { path = "../../crates/openmind-sandbox" }
cgroup-detect = { path = "../../crates/cgroup-detect" }
libc = "0.2"

[profile.release]
opt-level = "s"
panic = "abort"
strip = true
