[workspace]
resolver = "2"
# crates/one-defence (read-only port of galion-light/one/defence.py) joins via this glob.
members = ["crates/*"]
# contrib/grokbot is a vendored, read-only material dump with its own package.
# It is not part of the OpenMind workspace.
exclude = ["contrib"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
toml = "0.8"

# Release profile:
# opt-level = "z" -> minimize binary size. The workspace crates are small I/O
# helpers and HTTP servers, not hot compute loops, and T3 targets < 2 MB per
# binary. Speed matters far less here than footprint, so "z" over "3".
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Exception to opt-level "z" for the on-device voice models only (voice-rust):
# Chatterbox and Whisper run billions of multiply-adds per request in candle
# and gemm, and "z" makes those loops several times slower. Size of every other
# binary is unchanged (per-package overrides apply only where these crates are
# linked, i.e. the voice service).
[profile.release.package.candle-core]
opt-level = 3
[profile.release.package.candle-nn]
opt-level = 3
[profile.release.package.gemm]
opt-level = 3
[profile.release.package.gemm-common]
opt-level = 3
[profile.release.package.gemm-f32]
opt-level = 3
[profile.release.package.gemm-f16]
opt-level = 3
[profile.release.package.gemm-f64]
opt-level = 3
[profile.release.package.gemm-c32]
opt-level = 3
[profile.release.package.gemm-c64]
opt-level = 3
[profile.release.package.pulp]
opt-level = 3
[profile.release.package.half]
opt-level = 3
[profile.release.package.rayon-core]
opt-level = 3
[profile.release.package.galion-chatterbox]
opt-level = 3
[profile.release.package.galion-voice-cpu]
opt-level = 3
