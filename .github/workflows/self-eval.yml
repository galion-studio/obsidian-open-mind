# SPDX-FileCopyrightText: 3000 Galion / galion-studio
#
# self-eval: the stack's own gate. Every job here must be green on `main`
# before the repository may be flipped to public (see docs/PUBLISHING.md).
# One workflow, merged from the package gate (fmt, clippy, test, gitleaks,
# license, no-Python, CJK, Zagreb timestamps) and ws/side's repo-check job.
# Read-only: no secrets, no publishing, no network beyond toolchain/crates
# and the checksum-verified gitleaks binary. Also callable from release.yml.
name: self-eval

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: self-eval-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TZ: Europe/Zagreb

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path edge/openmind-node/Cargo.toml --all -- --check

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
      - run: cargo test --workspace --locked

  omnode:
    name: omnode (edge/openmind-node, own workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --manifest-path edge/openmind-node/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path edge/openmind-node/Cargo.toml --locked

  tier1:
    name: tier-1 musl release build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64-unknown-linux-musl, aarch64-unknown-linux-musl ]
    env:
      ZIG_VERSION: 0.15.2
      ZIG_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # rusqlite "bundled" (desk-hermes) compiles sqlite3.c: zig cc is the
      # C cross compiler for musl (checksum-verified tarball, no apt).
      - name: install zig cc (musl C cross compiler)
        run: |
          set -eu
          tgz="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          curl -sSfLO "https://ziglang.org/download/${ZIG_VERSION}/$tgz"
          echo "${ZIG_SHA256}  $tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig" && tar -C "$RUNNER_TEMP/zig" --strip-components=1 -xJf "$tgz" && rm -f "$tgz"
          arch="${{ matrix.target }}"; arch="${arch%%-*}"
          w="$RUNNER_TEMP/zig/musl-cc"
          printf '%s\n' '#!/bin/sh' 'for a do shift; case "$a" in --target=*|-target) continue ;; esac; set -- "$@" "$a"; done' \
            "exec \"$RUNNER_TEMP/zig/zig\" cc -target ${arch}-linux-musl \"\$@\"" > "$w"
          printf '%s\n' '#!/bin/sh' "exec \"$RUNNER_TEMP/zig/zig\" ar \"\$@\"" > "$RUNNER_TEMP/zig/musl-ar"
          chmod +x "$w" "$RUNNER_TEMP/zig/musl-ar"
          t="$(echo '${{ matrix.target }}' | tr - _)"
          echo "CC_${t}=$w" >> "$GITHUB_ENV"
          echo "AR_${t}=$RUNNER_TEMP/zig/musl-ar" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-cache" >> "$GITHUB_ENV"
      - name: build workspace release binaries
        run: cargo build --release --workspace --locked --target ${{ matrix.target }}
      - name: clippy for the target (cfg paths such as galion_no_sqlite)
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - name: build omnode
        run: cargo build --release --locked --manifest-path edge/openmind-node/Cargo.toml --target ${{ matrix.target }}
      - name: sizes and static check
        run: |
          for f in $(find target/${{ matrix.target }}/release edge/openmind-node/target/${{ matrix.target }}/release -maxdepth 1 -type f -executable); do
            printf '%s\t%s\tNEEDED=%s\n' "$(stat -c %s "$f")" "$(basename "$f")" "$(readelf -d "$f" | grep -c NEEDED || true)"
          done
  repo-check:
    name: repo-check self-eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: never
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch head 2026-10-20
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - name: build repo-check (portable musl)
        run: cargo build --release --locked -p repo-check --target x86_64-unknown-linux-musl
      - name: self-eval
        run: |
          bin=target/x86_64-unknown-linux-musl/release/repo-check
          "$bin" --json --copyright "3000 Galion / galion-studio" > self-eval.json || true
          "$bin" --copyright "3000 Galion / galion-studio"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: self-eval
          path: self-eval.json
          retention-days: 14

  no-python:
    name: no Python (files or shebangs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: fail on any *.py file or python shebang
        run: |
          set -eu
          bad=0
          if git ls-files '*.py' '*.pyc' '*.pyw' | grep -q .; then
            echo "::error::Python files are not allowed in this repository:"
            git ls-files '*.py' '*.pyc' '*.pyw'
            bad=1
          fi
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if head -n 1 -- "$f" | grep -aqE '^#!.*python'; then
              echo "::error file=$f::python shebang"
              bad=1
            fi
          done < <(git ls-files)
          [ "$bad" = 0 ] && echo "ok: no Python files, no python shebangs"
          exit "$bad"

  cjk-scan:
    name: no CJK characters
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: scan tracked text for Han, Hiragana, Katakana, Hangul
        run: |
          set -eu
          if git ls-files -z | xargs -0 grep -InP \
            '[\x{2E80}-\x{2EFF}\x{3000}-\x{303F}\x{3040}-\x{30FF}\x{3400}-\x{4DBF}\x{4E00}-\x{9FFF}\x{AC00}-\x{D7AF}\x{F900}-\x{FAFF}]' ; then
            echo "::error::Stray CJK characters found. Remove them."
            exit 1
          fi
          echo "ok: no CJK characters"

  zagreb-timestamps:
    name: Zagreb timestamps (best effort, warning only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: warn on ISO timestamps ending in Z (UTC) in tracked text
        run: |
          set -u
          hits=$(git ls-files -z -- ':!*.lock' ':!.github/workflows/*' | xargs -0 grep -InE '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?(\.[0-9]+)?Z\b' || true)
          if [ -n "$hits" ]; then
            echo "$hits" | while IFS= read -r l; do echo "::warning::UTC-style timestamp (use Europe/Zagreb with offset): $l"; done
          else
            echo "ok: no Z-suffixed timestamps"
          fi

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: install gitleaks (checksum-verified binary)
        run: |
          set -eu
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tgz"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " $tgz\$" checksums.txt | sha256sum -c -
          tar xzf "$tgz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$tgz" checksums.txt gitleaks
      - name: scan full git history (values redacted in output)
        run: gitleaks git --redact --no-banner --verbose .

  license:
    name: license check (MIT)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: LICENSE present and MIT; workspace declares MIT; crate copies identical
        run: |
          set -eu
          test -f LICENSE || { echo "::error::LICENSE missing"; exit 1; }
          head -n 1 LICENSE | grep -qx 'MIT License' || { echo "::error::LICENSE is not the MIT text"; exit 1; }
          grep -qx 'Copyright (c) 3000 Galion / galion-studio' LICENSE || { echo "::error::LICENSE copyright line changed"; exit 1; }
          grep -q 'Permission is hereby granted, free of charge' LICENSE || { echo "::error::MIT grant text missing"; exit 1; }
          grep -qE '^license *= *"MIT"' Cargo.toml || { echo "::error::Cargo.toml [workspace.package] license is not MIT"; exit 1; }
          for l in crates/*/LICENSE edge/*/LICENSE; do
            cmp -s LICENSE "$l" || { echo "::error file=$l::differs from root LICENSE"; exit 1; }
          done
          echo "ok: MIT"
