#
# Chatterbox (Resemble AI, MIT) text-to-speech inference in pure Rust on candle,
# CPU only: no cuda/metal/mkl/accelerate features, no CPU-pinning build flags.

[package]
name = "galion-chatterbox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chatterbox TTS (T3 + S3Gen + HiFT, voice cloning from a reference clip) on candle, CPU only."

[dependencies]
candle-core = { version = "0.9", default-features = false }
candle-nn = { version = "0.9", default-features = false }
serde_json = { workspace = true }
# Already in the tree via candle-core and gemm (same version, no new crate).
rayon = "1"
# Already in the tree via candle-core (same version): called directly for the
# blocked attention of the flow decoder (fastops::attention_qkv).
gemm = "0.19"

[[example]]
name = "chatterbox-say"

[[example]]
name = "op-bench"
